<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi rutina</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eceef1;--pn:#fff;--ink:#15171c;--mut:#667085;--ln:#d9dde3;--in:#f5f6f8;--ac:#2f5bff;--bar:#15171c;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--pn:#181b21;--ink:#eceef2;--mut:#98a0ad;--ln:#2b303a;--in:#20242c;--bar:#0a0b0e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--pn:#181b21;--ink:#eceef2;--mut:#98a0ad;--ln:#2b303a;--in:#20242c;--bar:#0a0b0e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--in);border:1px solid var(--ln);border-radius:6px;padding:8px 9px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{cursor:pointer;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:7px 12px;font-weight:500}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.top{background:var(--bar);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.top h1{flex:1;margin:0;font:700 26px "Barlow Condensed",sans-serif}
.top button{background:#ffffff14;border-color:#fff3;color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.auth{max-width:420px;margin:7vh auto}
.auth h1{font:700 34px "Barlow Condensed",sans-serif;margin:0 0 12px}
.f{display:grid;gap:10px}.f label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:13px}.err{color:#d6361f;min-height:20px;font-size:14px}
.adm{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
@media(max-width:760px){.adm{grid-template-columns:1fr}}
.cl{display:block;width:100%;text-align:left;margin-bottom:6px}.cl.on{border-color:var(--ac);box-shadow:inset 4px 0 var(--ac)}
.day{border:1px solid var(--ln);border-radius:8px;margin-bottom:12px;overflow:hidden;background:var(--pn)}
.dh{background:var(--bar);color:#fff;padding:8px 12px;border-left:6px solid var(--ac);font:700 21px "Barlow Condensed",sans-serif;display:flex;gap:8px;align-items:center}
.dh input{background:transparent;border:0;color:#fff;font:inherit;padding:2px}
.rw{display:grid;grid-template-columns:6.5rem 1fr 3.2rem 4.6rem 1.8rem;gap:4px;padding:4px 10px}
.rw input{padding:6px 7px;font-size:14px}.rw button{padding:0}
.cv{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--ln)}
.cv b{font-weight:600}.cv span{color:var(--mut);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}.row>*{flex:1 1 130px}
@media print{.top,button,.np{display:none!important}body{background:#fff}.day{break-inside:avoid}}
.top .on{background:var(--ac);border-color:var(--ac)}.r2{display:flex;gap:6px;margin-bottom:6px}.r2 .cl{margin:0;flex:1}details summary{cursor:pointer}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;box-shadow:0 4px 20px #0006;max-width:90vw}
</style>
</head>

<script>
/* ===== CONFIGURACIÓN ===== */
const SB_URL='https://xkevebgqeirercfawwhj.supabase.co',SB_KEY='sb_publishable_M06Lb2RvyTdXMNEaPwqAzA_vorp13pb',DOM='@rutinas.example.com';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== EJERCICIOS: sin sufijo = gym, |c = casa, |a = ambos ===== */

"Espalda":"Jalón al pecho agarre ancho;Jalón agarre neutro;Jalón agarre supino;Dominadas pronas|a;Dominadas supinas|a;Remo con barra;Remo Pendlay;Remo con mancuerna a una mano|a;Remo en polea baja;Remo T con barra;Remo en máquina;Pulldown brazos rectos;Peso muerto convencional;Peso muerto sumo;Rack pulls;Hiperextensiones|a;Remo con banda|c;Jalón con banda|c;Remo invertido bajo una mesa|c;Superman en suelo|c;Remo con mochila|c;Remo con toalla en una puerta|c",
"Hombro":"Press militar con barra;Press militar sentado;Press con mancuernas|a;Press Arnold|a;Press de hombros en máquina;Elevaciones laterales|a;Elevaciones laterales en polea;Elevaciones frontales|a;Pájaro con mancuernas|a;Peck deck inverso;Face pulls en polea;Remo al mentón;Flexiones pike|c;Flexión en pino contra la pared|c;Elevaciones laterales con banda|c;Elevaciones laterales con botellas|c;Face pulls con banda|c;Press de hombro con banda|c",
"Trapecio":"Encogimientos con barra;Encogimientos con mancuernas|a;Encogimientos en Smith;Encogimientos en polea;Paseo del granjero|a;Encogimientos con banda|c;Remo alto con banda|c",
"Cuádriceps":"Sentadilla con barra;Sentadilla frontal;Sentadilla hack;Prensa 45°;Extensiones de cuádriceps;Sentadilla en Smith;Sentadilla búlgara|a;Zancadas|a;Sentadilla goblet|a;Sentadilla sissy|a;Sentadilla con peso corporal|c;Sentadilla con salto|c;Sentadilla pistol asistida|c;Zancadas con peso corporal|c;Sentadilla isométrica en pared|c;Step-ups en silla|c;Sentadilla con mochila|c;Sentadilla con banda|c",
"Femorales":"Peso muerto rumano con barra;Peso muerto rumano con mancuernas|a;Curl femoral tumbado;Curl femoral sentado;Curl femoral unilateral;Buenos días;Nordic curl|a;Peso muerto piernas rígidas;Curl femoral con toalla|c;Peso muerto a una pierna|c;Puente de glúteo a una pierna|c;Curl femoral con banda|c",
"Glúteos":"Hip thrust con barra;Hip thrust en máquina;Glute bridge con peso|a;Patada de glúteo en polea;Patada de glúteo en máquina;Abducción en máquina;Sentadilla sumo|a;Step-ups en cajón|a;Zancadas inversas|a;Puente de glúteo|c;Hip thrust en sofá|c;Patada en cuadrupedia|c;Almeja con banda|c;Caminata lateral con banda|c;Donkey kicks con banda|c",
"Pantorrilla":"Talones de pie en máquina;Talones sentado;Talones en prensa;Talones con mancuerna|a;Talones en Smith;Talones en un escalón|c;Talones a una pierna|c;Saltos de pantorrilla|c",
"Bíceps":"Curl con barra recta;Curl con barra Z;Curl alterno|a;Curl inclinado|a;Curl martillo|a;Curl martillo en polea;Curl Scott;Curl concentrado|a;Curl araña;Curl en polea;Curl drag;Curl con banda|c;Curl con mochila|c;Curl con botellas|c",
"Tríceps":"Press francés;Extensión en polea con cuerda;Extensión en polea con barra;Extensión tras nuca|a;Extensión tras nuca en polea;Fondos en paralelas;Press agarre cerrado;Patada de tríceps|a;Extensión katana;Fondos en silla|c;Flexiones cerradas|c;Extensión con banda|c;Extensión tras nuca con mochila|c",
"Antebrazo":"Curl de muñeca con barra;Curl de muñeca invertido;Curl de muñeca con mancuernas|a;Curl inverso con barra Z;Enrollamiento de muñeca;Colgado en barra|a;Curl de muñeca con botellas|c;Estrujar una toalla|c",
"Core":"Crunch en polea;Elevación de piernas colgado;Elevación de rodillas en silla capitán;Rueda abdominal|a;Giros rusos|a;Woodchopper en polea;Crunch|c;Plancha|c;Plancha lateral|c;Mountain climbers|c;Bicicleta abdominal|c;Dead bug|c;Elevación de piernas tumbado|c;Hollow hold|c;Plancha con toque de hombro|c;Vacuum abdominal|c",
"Cardio":"Cinta: caminata inclinada;Cinta: sprints HIIT;Bicicleta estática;Elíptica;Escaladora;Remo ergómetro;Assault bike;Trineo;Saltar la cuerda|a;Kettlebell swings|a;Burpees|c;Jumping jacks|c;Rodillas altas|c;Skaters|c;Trote en el lugar|c;Boxeo de sombra|c;Circuito tabata|c"};
const DB=Object.fromEntries(Object.entries(RAW).map(([m,s])=>[m,s.split(';').map(x=>{const[n,t='g']=x.split('|');return{n,t}})]));
const pool=(m,pl)=>(DB[m]||[]).filter(o=>o.t=='a'||o.t==(pl=='casa'?'c':'g')).map(o=>o.n);
/* ===== GENERADOR AUTOMÁTICO ===== */
const GOALS={fuerza:{s:4,r:'4-6',d:'150 s'},hipertrofia:{s:4,r:'8-12',d:'90 s'},'pérdida de grasa':{s:3,r:'12-15',d:'45-60 s'},'salud y tono':{s:3,r:'10-12',d:'60-90 s'}};
const LV=['principiante','intermedio','avanzado'],SEX=['mujer','hombre','otro'],PL=['gym','casa'];
const BON={mujer:{Glúteos:1,Femorales:0},hombre:{Hombro:1,Pecho:0,Espalda:1}}; /* énfasis editable por sexo */
const FULL=[['Cuerpo completo A',['Cuádriceps','Pecho','Espalda','Core']],['Cuerpo completo B',['Glúteos','Hombro','Espalda','Bíceps','Tríceps']],['Cuerpo completo C',['Femorales','Pecho','Espalda','Core','Pantorrilla']]];
const UL=[['Tren superior',['Pecho','Espalda','Hombro','Bíceps','Tríceps']],['Tren inferior',['Cuádriceps','Femorales','Glúteos','Pantorrilla','Core']]];
const PPL=[['Empuje',['Pecho','Hombro','Tríceps']],['Tirón',['Espalda','Bíceps','Core']],['Pierna',['Cuádriceps','Femorales','Glúteos','Pantorrilla']]];
const split=d=>d<=3?FULL.slice(0,Math.max(2,d)):d==4?[...UL,...UL]:Array.from({length:d},(_,i)=>PPL[i%3]);
function gen(o){const g=GOALS[o.goal]||GOALS.hipertrofia,lv=Math.max(0,LV.indexOf(o.level)),bon=BON[o.sex]||{};
 return{rest:g.d,days:split(+o.days||3).map(([t,ms],i)=>{const ex=[];
  ms.forEach(m=>{const p=pool(m,o.place);if(!p.length)return;const n=Math.max(1,(ms.length>4?1:2)+(lv==0&&ms.length<=4?-1:0)+(lv==2&&ms.length<=4?1:0)+(bon[m]||0));
   for(let k=0;k<n&&k<p.length;k++)ex.push({m,n:p[(i*3+k+lv)%p.length],s:String(Math.max(2,g.s+lv-1)),r:g.r,t:''})});
  if(o.goal=='pérdida de grasa'){const p=pool('Cardio',o.place);ex.push({m:'Cardio',n:p[i%p.length],s:'1',r:'15-20 min',t:''})}
  return{name:`Día ${i+1} · ${t}`,ex}})}}
/* ===== SESIÓN ===== */
let me=null,clients=[],tpls=[],invs=[],cur=null,R=null;
const uname=v=>(v||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
const opts=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
const err=m=>{const e=$('#err');if(e)e.textContent=m};
async function init(){const{data:{session}}=await sb.auth.getSession();session?boot():authView()}
async function boot(){const{data:{user}}=await sb.auth.getUser();if(!user)return authView();
 const{data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();me=data;
 if(!me){app.innerHTML=`<div class="auth box"><h1>Perfil no encontrado</h1><p class="mut">Tu cuenta existe pero no tiene perfil. Pide un nuevo código de invitación.</p><button onclick="out()">Salir</button></div>`;return}
 me.role=='admin'?adminView():clientView()}
const out=async()=>{await sb.auth.signOut();me=cur=R=null;authView()};
function authView(reg){const code=new URLSearchParams(location.search).get('code')||'';reg=reg??!!code;
 app.innerHTML=`<div class="auth box"><h1>${reg?'Crear mi cuenta':'Entrar'}</h1><div class="f">
 ${reg?`<div><label>Código de invitación</label><input id="c" value="${esc(code)}"></div><div><label>Nombre completo</label><input id="n"></div>`:''}
 <div><label>Usuario</label><input id="u" autocomplete="username" autocapitalize="none"></div>
 <div><label>Contraseña (mínimo 6 caracteres)</label><input id="p" type="password" autocomplete="${reg?'new':'current'}-password"></div>
 ${reg?`<div class="g2"><div><label>Objetivo</label><select id="g">${opts(Object.keys(GOALS))}</select></div><div><label>Nivel</label><select id="l">${opts(LV)}</select></div>
 <div><label>Sexo</label><select id="s">${opts(SEX)}</select></div><div><label>Días por semana</label><select id="d">${opts([2,3,4,5,6],3)}</select></div></div>
 <div><label>Dónde entrenas</label><select id="pl">${opts(PL)}</select></div>`:''}
 <div class="err" id="err"></div><button class="pri" id="go">${reg?'Crear cuenta':'Entrar'}</button>
 <button onclick="authView(${!reg})">${reg?'Ya tengo cuenta':'Tengo un código de invitación'}</button></div></div>`;
 $('#go').onclick=reg?register:login}
async function login(){const u=uname($('#u').value);if(!u||!$('#p').value)return err('Escribe usuario y contraseña');
 const{error}=await sb.auth.signInWithPassword({email:u+DOM,password:$('#p').value});error?err('Usuario o contraseña incorrectos'):boot()}
async function register(){const u=uname($('#u').value),p=$('#p').value,c=$('#c').value.trim(),n=$('#n').value.trim();
 if(!c||!n||u.length<3||p.length<6)return err('Completa código, nombre, usuario (3+ letras) y contraseña (6+)');
 const ok=await sb.rpc('check_invite',{c});if(!ok.data)return err('Ese código no es válido o ya se usó');
 const{data,error}=await sb.auth.signUp({email:u+DOM,password:p});
 if(error)return err(/registered/i.test(error.message)?'Ese usuario ya existe':error.message);
 if(!data.session)return err('Falta desactivar Confirm email en Supabase');
 const r=await sb.rpc('register_profile',{c,u,n,g:$('#g').value,l:$('#l').value,s:$('#s').value,d:+$('#d').value,p:$('#pl').value});
 if(r.error){await sb.auth.signOut();return err('No se pudo crear el perfil: '+r.error.message)}boot()}
/* ===== VISTA CLIENTE ===== */
const fd=s=>new Date(s).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
const showR=r=>r&&r.days?`<p class="mut">Descanso entre series: ${esc(r.rest||'')}</p>`+r.days.map(d=>`<div class="day"><div class="dh">${esc(d.name)}</div>${d.ex.filter(e=>e.n).map(e=>`<div class="cv"><div><b>${esc(e.n)}</b><div class="mut">${esc(e.m)}${e.t?' · '+esc(e.t):''}</div></div><span>${esc(e.s)} × ${esc(e.r)}</span></div>`).join('')}</div>`).join(''):'<p class="mut">Tu entrenador aún no te asigna una rutina. Vuelve pronto.</p>';
async function clientView(){const{data}=await sb.from('routines').select('*').order('created_at',{ascending:false});const L=data||[];
 app.innerHTML=`<div class="top"><h1>Hola, ${esc(me.full_name)}</h1><button onclick="print()">Imprimir</button><button onclick="out()">Salir</button></div><main><div class="box"><b>Objetivo:</b> ${esc(me.goal)} · <b>Nivel:</b> ${esc(me.level)} · <b>Entrenas:</b> ${esc(me.place)}, ${me.days} días</div>${L.length?`<h2 style="margin:6px 0">${esc(L[0].name)} <span class="mut" style="font-size:14px">${fd(L[0].created_at)} · rutina actual</span></h2>${showR(L[0].data)}${L.length>1?'<h3>Rutinas anteriores</h3>'+L.slice(1).map(r=>`<details class="box"><summary><b>${esc(r.name)}</b> <span class="mut">${fd(r.created_at)}</span></summary>${showR(r.data)}</details>`).join(''):''}`:showR(null)}</main>`}
/* ===== PANEL ADMIN ===== */
let tab='c',rts=[],rid=null,rname='',busy=0,G0={goal:'hipertrofia',level:'principiante',sex:'mujer',days:3,place:'gym'};
const copy=o=>JSON.parse(JSON.stringify(o)),LB={goal:'Objetivo',level:'Nivel',sex:'Sexo',days:'Días',place:'Lugar'};
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
async function load(){const[a,b,c]=await Promise.all([sb.from('profiles').select('*').eq('role','client').order('created_at',{ascending:false}),sb.from('templates').select('*').order('name'),sb.from('invites').select('*').eq('used',false).eq('admin',false)]);clients=a.data||[];tpls=b.data||[];invs=c.data||[];rts=[];
 if(cur){cur=clients.find(z=>z.id==cur.id)||null;if(cur)rts=(await sb.from('routines').select('*').eq('client_id',cur.id).order('created_at',{ascending:false})).data||[]}}
const clientsCol=base=>`<div class="box"><b>Clientes (${clients.length})</b><div style="margin-top:8px">${clients.map(c=>`<button class="cl${cur&&cur.id==c.id?' on':''}" data-a="pick" data-id="${c.id}">${esc(c.full_name)}<div class="mut">${esc(c.username)} · ${esc(c.goal)}</div></button>`).join('')||'<span class="mut">Aún no hay clientes.</span>'}</div></div><div class="box"><b>Invitar cliente</b><div class="row"><button class="pri" data-a="inv">Crear link de registro</button></div>${invs.map(i=>`<div class="mut" style="word-break:break-all;margin-top:8px">${esc(base+'?code='+i.code)} <button data-a="delinv" data-code="${i.code}">×</button></div>`).join('')}</div>`;
const tplCol=()=>`<div class="box"><b>Base de plantillas (${tpls.length})</b><div class="row"><button class="pri" data-a="new">+ Nueva plantilla</button></div><div style="margin-top:8px">${tpls.map(p=>`<div class="r2"><button class="cl${rid==p.id?' on':''}" data-a="openT" data-id="${p.id}">${esc(p.name)}</button><button data-a="delT" data-id="${p.id}">Eliminar</button></div>`).join('')||'<span class="mut">Aún no tienes plantillas.</span>'}</div></div>`;
const clientPanel=()=>`<div class="box"><b style="font:700 24px 'Barlow Condensed'">${esc(cur.full_name)}</b> <span class="mut">usuario: ${esc(cur.username)} · ${esc(cur.goal)}, ${esc(cur.level)}, ${esc(cur.place)}, ${cur.days} días</span><div style="margin-top:10px"><b>Rutinas del cliente (${rts.length})</b></div>${rts.map(r=>`<div class="r2"><button class="cl${rid==r.id?' on':''}" data-a="openR" data-id="${r.id}">${esc(r.name)}<div class="mut">${fd(r.created_at)}</div></button><button data-a="delR" data-id="${r.id}">Eliminar</button></div>`).join('')||'<p class="mut">Todavía no tiene rutinas.</p>'}<div class="row"><button data-a="new">+ Nueva rutina</button><button data-a="delc">Eliminar cliente</button></div></div>`+work();
const sel=(k,a)=>`<div><label class="mut">${LB[k]}</label><select data-g="${k}">${opts(a,G0[k])}</select></div>`;
function work(){const T=tab=='c';return`<div class="box"><b>${T?'Crear o editar rutina':'Crear o editar plantilla'}</b><div class="row">${sel('goal',Object.keys(GOALS))}${sel('level',LV)}${sel('sex',SEX)}${sel('days',[2,3,4,5,6])}${sel('place',PL)}</div><div class="row"><button class="pri" data-a="gen">Generar automática</button><button data-a="blank">Crear en blanco</button>${T?`<select id="tp"><option value="">Cargar plantilla…</option>${tpls.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button data-a="lt">Cargar</button>`:''}</div></div>`+(R?`<div class="box row"><input id="rn" value="${esc(rname)}" placeholder="Nombre, ej. Fuerza semanas 1-4"><button class="pri" data-a="save">${rid?'Guardar cambios':T?'Guardar en el perfil del cliente':'Guardar plantilla'}</button></div><div id="ed">${editor()}</div>`:'')}
const editor=()=>`<div class="box"><label class="mut">Descanso entre series</label><input data-f="rest" value="${esc(R.rest||'')}" style="max-width:200px"></div>`+R.days.map((d,i)=>`<div class="day"><div class="dh"><input data-d="${i}" data-f="name" value="${esc(d.name)}"><button data-a="delD" data-d="${i}">Quitar día</button></div>${d.ex.map((e,k)=>`<div class="rw">${['m','n','s','r'].map(f=>`<input ${f=='n'?'list="dl" ':''}data-d="${i}" data-x="${k}" data-f="${f}" value="${esc(e[f])}" placeholder="${{m:'Músculo',n:'Ejercicio',s:'Ser.',r:'Reps'}[f]}">`).join('')}<button data-a="delE" data-d="${i}" data-x="${k}">×</button><input style="grid-column:1/-1" data-d="${i}" data-x="${k}" data-f="t" value="${esc(e.t)}" placeholder="Nota (peso, tempo, técnica)"></div>`).join('')}<div style="padding:6px 10px"><button data-a="addE" data-d="${i}">+ Ejercicio</button></div></div>`).join('')+`<button data-a="addD" style="margin-bottom:12px">+ Día</button>`;
const redraw=()=>{$('#ed').innerHTML=editor()};
async function adminView(){await load();const base=location.origin+location.pathname,C=tab=='c';
 app.innerHTML=`<div class="top"><h1>Panel de administrador</h1><button class="${C?'on':''}" data-a="tab" data-t="c">Clientes</button><button class="${C?'':'on'}" data-a="tab" data-t="t">Plantillas</button><button onclick="out()">Salir</button></div><main><div class="adm"><div>${C?clientsCol(base):tplCol()}</div><div>${C?(cur?clientPanel():'<div class="box mut">Elige un cliente de la lista para ver sus rutinas y crearle una nueva.</div>'):work()}</div></div></main><datalist id="dl">${[...new Set(Object.values(DB).flat().map(o=>o.n))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`}
document.addEventListener('input',e=>{const t=e.target,{d,x,f}=t.dataset;if(t.id=='rn'){rname=t.value;return}if(!R||!f)return;if(x!=null)R.days[d].ex[x][f]=t.value;else if(d!=null)R.days[d][f]=t.value;else R[f]=t.value});
document.addEventListener('change',e=>{const g=e.target.dataset.g;if(g)G0[g]=e.target.value});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const{a,d,x,id,code}=t.dataset,T=tab=='c';
 const sure=()=>{if(t.dataset.sure)return 1;t.dataset.sure=1;t.textContent='¿Seguro?'};
 switch(a){
 case'tab':tab=t.dataset.t;R=rid=null;rname='';adminView();break;
 case'pick':cur=clients.find(c=>c.id==id);G0={goal:cur.goal,level:cur.level,sex:cur.sex,days:cur.days,place:cur.place};R=rid=null;rname='';adminView();break;
 case'new':R=rid=null;rname='';adminView();break;
 case'gen':R=gen(G0);rid=null;rname=T?'Rutina '+G0.goal:'Plantilla '+G0.goal+' '+G0.days+' días';await adminView();toast('Rutina generada. Revísala, edítala y guárdala.');break;
 case'blank':R={rest:'90 s',days:[{name:'Día 1',ex:[]}]};rid=null;rname='';adminView();break;
 case'lt':{const p=tpls.find(z=>z.id==$('#tp').value);if(!p)return toast('Elige una plantilla primero');R=copy(p.routine);rid=null;rname=p.name;await adminView();toast('Plantilla cargada como rutina nueva. Guárdala para asignarla.');break}
 case'openR':{const r=rts.find(z=>z.id==id);R=copy(r.data);rid=r.id;rname=r.name;adminView();break}
 case'openT':{const p=tpls.find(z=>z.id==id);R=copy(p.routine);rid=p.id;rname=p.name;adminView();break}
 case'save':{if(busy)return;if(!R)return toast('Primero crea o genera una rutina');const name=($('#rn').value||'').trim()||'Sin nombre';rname=name;busy=1;t.disabled=true;
  const tb=T?'routines':'templates',p=T?{name,data:R}:{name,routine:R};if(T&&!rid)p.client_id=cur.id;
  const q=rid?await sb.from(tb).update(p).eq('id',rid):await sb.from(tb).insert(p).select('id').single();busy=0;
  if(q.error){t.disabled=false;return toast('No se pudo guardar: '+q.error.message)}
  if(!rid)rid=q.data.id;await adminView();toast(T?'Guardada en el perfil de '+cur.full_name:'Plantilla guardada');break}
 case'delR':case'delT':{if(sure())return;await sb.from(a=='delR'?'routines':'templates').delete().eq('id',id);if(rid==id){R=rid=null;rname=''}await adminView();toast('Eliminada');break}
 case'delc':if(sure())return;await sb.from('profiles').delete().eq('id',cur.id);cur=null;R=rid=null;await adminView();toast('Cliente eliminado');break;
 case'inv':{await sb.from('invites').insert({code:Math.random().toString(36).slice(2,10)});await adminView();toast('Link creado');break}
 case'delinv':await sb.from('invites').delete().eq('code',code);adminView();break;
 case'addD':R.days.push({name:'Día '+(R.days.length+1),ex:[]});redraw();break;
 case'delD':R.days.splice(d,1);redraw();break;
 case'addE':R.days[d].ex.push({m:'',n:'',s:'3',r:'10-12',t:''});redraw();break;
 case'delE':R.days[d].ex.splice(x,1);redraw();break;
 }});
init();
</script>
</body>
</html>
