body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--in);border:1px solid var(--ln);border-radius:6px;padding:8px 9px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{cursor:pointer;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:7px 12px;font-weight:500}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.top{background:var(--bar);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.top h1{flex:1;margin:0;font:700 26px "Barlow Condensed",sans-serif}
.top button{background:#ffffff14;border-color:#fff3;color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.auth{max-width:420px;margin:7vh auto}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:13px}.err{color:#d6361f;min-height:20px;font-size:14px}
.adm{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
@media(max-width:760px){.adm{grid-template-columns:1fr}}
.cl{display:block;width:100%;text-align:left;margin-bottom:6px}.cl.on{border-color:var(--ac);box-shadow:inset 4px 0 var(--ac)}
.day{border:1px solid var(--ln);border-radius:8px;margin-bottom:12px;overflow:hidden;background:var(--pn)}
.dh{background:var(--bar);color:#fff;padding:8px 12px;border-left:6px solid var(--ac);font:700 21px "Barlow Condensed",sans-serif;display:flex;gap:8px;align-items:center}
.dh input{background:transparent;border:0;color:#fff;font:inherit;padding:2px}
.rw{display:grid;grid-template-columns:46px 6rem 1fr 3rem 4.2rem 4.2rem 1.8rem;gap:4px;padding:4px 10px;align-items:center}
.rw input{padding:6px 7px;font-size:14px}.rw button{padding:0}
.cv{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--ln)}
.cv b{font-weight:600}.cv span{color:var(--mut);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}.row>*{flex:1 1 130px}
@media print{.top,button,.np{display:none!important}body{background:#fff}.day{break-inside:avoid}}
.top .on{background:var(--ac);border-color:var(--ac)}.r2{display:flex;gap:6px;margin-bottom:6px}.r2 .cl{margin:0;flex:1}details summary{cursor:pointer}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;box-shadow:0 4px 20px #0006;max-width:90vw}
.rw .nt{grid-column:2/-1}
@media(max-width:700px){.rw{grid-template-columns:46px 1fr 3rem 3.8rem 3.8rem 1.8rem}.rw .m{display:none}}
textarea{background:var(--in);border:1px solid var(--ln);border-radius:6px;padding:8px 9px;width:100%;font:inherit;color:inherit;resize:vertical}
.th{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--in);flex:none;display:block;cursor:pointer}
.ph{border:1px dashed var(--ln)}.tc{display:block;width:44px;height:44px}
.cv{align-items:center}.cv .nm{flex:1;display:flex;gap:10px;align-items:center;min-width:0}.cv .th{width:56px;height:56px}
.mdl{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.mdl .in{background:var(--pn);border-radius:12px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.mdl h3{margin:0 0 4px;font:700 26px "Barlow Condensed",sans-serif}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}.imgs img{width:100%;border-radius:8px;background:var(--in);min-height:120px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lc{display:flex;gap:10px;text-align:left;align-items:center}.lc>span{display:flex;flex-direction:column;min-width:0}.lc small{color:var(--mut);font-size:12px}
.note{background:var(--in);border-left:4px solid var(--ac);border-radius:6px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.dnote{padding:6px 12px;font-size:13px;color:var(--mut)}
@media print{.note,.dnote{break-inside:avoid}}
</style>

  else if(e.c&&!SMALL.has(m)){
   if(g=='fuerza'){s=rank==0?(lv==0?'3':lv==1?'4':'5'):'3';r=rank==0?(light||lv==0?'5-8':'3-5'):(light?'6-10':'5-8');d='2-3 min'}
   else if(g=='hipertrofia'){s=rank==0&&lv>0&&!light?'4':'3';r=rank==0?(light||lv==0?'8-12':'6-10'):(light?'10-12':'8-12');d=rank==0?'90-120 s':'90 s'}
   else if(g=='pérdida de grasa'){s='3';r=light?'12-15':'10-15';d='45-60 s'}
   else{s=lv==0?'2':'3';r='10-15';d='60-90 s'}}
  else{
   if(g=='fuerza'){s=lv==0?'2':'3';r=light?'10-15':'8-12';d='90 s'}
   else if(g=='hipertrofia'){s=lv==0?'2':'3';r=light?'12-20':'10-15';d='60-90 s'}
   else if(g=='pérdida de grasa'){s=lv==0?'2':'3';r='12-20';d='30-45 s'}
   else{s=lv==0?'2':lv==1?'2':'3';r='12-15';d='60 s'}}
  return{s,r,d}};
 const cardio=(di,kind)=>{const a=CAT.filter(e=>e.g=='Ca'&&e.t<=tier&&LWT[lv][LI[e.lv]]>0&&e.f.includes(kind)).map(e=>{let w=LWT[lv][LI[e.lv]]*ew(e);if(ctx.used.has(e.es))w*=.1;if(avoid.has(e.es))w*=.4;return{e,w:w*w}});
  const e=wpick(a);if(!e)return null;ctx.used.add(e.es);
  if(kind=='l'){const dur=g=='salud y tono'?['10-15 min','15-20 min','15-20 min'][lv]:['15-20 min','20-25 min','25-30 min'][lv];return{m:'Cardio',n:e.es,s:'1',r:dur,d:'',t:'Ritmo constante: podrías hablar con frases cortas'}}
  return{m:'Cardio',n:e.es,s:['6','8','10'][lv],r:lv==0?'20 s':'30 s',d:lv==0?'40 s':'30 s',t:lv==0?'Intervalos: 20 s fuerte y 40 s suave':'Intervalos: 30 s fuerte y 30 s suave'}};
 const days=P.rows.map((row,di)=>{
  let it=row.ms.filter(x=>W(x.m)>0).map(x=>({m:x.m,w:x.w,n:clamp(Math.round(W(x.m)*x.w/tw[x.m]/3.3),1,SMALL.has(x.m)?3:4)}));
  const tot=()=>it.reduce((s,x)=>s+x.n,0);
  const fl=[3,4,4][lv];
  while(tot()<fl){const c=it.filter(x=>x.n<(SMALL.has(x.m)?3:4)).sort((a,b)=>b.w-a.w||it.indexOf(a)-it.indexOf(b))[0];if(!c)break;c.n++}
  while(tot()>cap){const c=it.filter(x=>x.n>1).sort((a,b)=>b.n-a.n||a.w-b.w||it.indexOf(b)-it.indexOf(a))[0];
   if(c)c.n--;else{if(it.length<=1)break;let k=it.length-1;const sec=it.map((x,i)=>x.w<1?i:-1).filter(i=>i>0);if(sec.length)k=sec[sec.length-1];it.splice(k,1)}}
  const dUsed=new Set(),dFam={},blocks=[];
  it.forEach(x=>{const m=x.m,ap=ctx.app[m]||0,pat=PAT[m]?PAT[m][x.n]:'i'.repeat(x.n),list=[];let cr=0;dFam[m]=dFam[m]||new Set();
   for(let s=0;s<x.n;s++){const role=pat[s];let sub;
    if(m=='Es'&&role=='c'){const order=(ap%2==0)?['v','h','v','h']:['h','v','h','v'];sub=order[cr]}
    const e=pick(m,role,sub,dUsed,dFam[m],s);if(!e)continue;
    dUsed.add(e.es);dFam[m].add(e.fam);(ctx.famU[m]=ctx.famU[m]||new Set()).add(e.fam);ctx.used.add(e.es);
    if(g=='fuerza'&&role=='c'&&s==0&&!ctx.main[m])ctx.main[m]=e;
    const p=rx(e,m,e.c?cr:1,ap);if(e.c)cr++;
    list.push({m:GN[m],n:e.es,s:p.s,r:p.r,d:p.d,t:uni.test(e.es)?'Por lado':'',_k:m,_c:e.c?1:0})}
   if(!SMALL.has(m))list.sort((a,b)=>b._c-a._c)
   ctx.app[m]=ap+1;blocks.push(list)});
  const late=b=>b.length&&['Pa','Co','An'].includes(b[0]._k);
  let ex=[...blocks.filter(b=>!late(b)),...blocks.filter(late)].flat().map(({_k,_c,...r})=>r);
  const ck=g=='pérdida de grasa'?(di%2==0&&lv>0?'h':'l'):(g=='salud y tono'&&di%2==0?'l':null);
  if(ck){const c=cardio(di,ck);if(c)ex.push(c)}
  return{name:`Día ${di+1} · ${row.label}`,note:tier==2?'Calentamiento: 5-8 min de cardio suave y movilidad. En el primer ejercicio haz 1-2 series de aproximación con poco peso.':'Calentamiento: 5 min de movilidad articular o cardio suave y 1 serie ligera del primer ejercicio.',ex}});
 const rir=['3','2','1-2'][lv];
 return{rest:'',split:P.name,msg:P.msg,note:`División: ${P.name}. Intensidad: termina cada serie dejando ${rir} repeticiones en reserva (sin llegar al fallo). Progresión: cuando completes todas las series en el tope del rango de repeticiones con buena técnica, sube el peso entre 2 y 5 %.${g=='fuerza'?' Los ejercicios básicos se repiten durante el ciclo para poder subir carga.':''} Cambia de rutina cada 4-6 semanas.`,days}}

 app.innerHTML=`<div class="top"><h1>Panel de administrador</h1>${nav}<button onclick="out()">Salir</button></div><main>${tab=='e'?libView():`<div class="adm"><div>${C?clientsCol(base):tplCol()}</div><div>${C?(cur?clientPanel():'<div class="box mut">Elige un cliente de la lista para ver sus rutinas y crearle una nueva.</div>'):work()}</div></div>`}</main><datalist id="dl">${CAT.filter(e=>e.g!='Ca'||e.id==''||true).map(e=>`<option value="${esc(e.es)}"${e.en?` label="${esc(e.en)}"`:''}>`).join('')}</datalist>`;
 if(tab=='e')fillLib()}
document.addEventListener('input',e=>{const t=e.target,{d,x,f}=t.dataset;
 if(t.id=='rn'){rname=t.value;return}
 if(t.id=='lq'){libQ=t.value;libN=60;fillLib();return}
 if(!R||!f)return;if(x!=null)R.days[d].ex[x][f]=t.value;else if(d!=null)R.days[d][f]=t.value;else R[f]=t.value});
document.addEventListener('change',e=>{const t=e.target,g=t.dataset.g;
 if(g){G0[g]=t.value;return}
 if(t.id=='lg'){libG=t.value;libN=60;fillLib();return}
 if(t.id=='lt'){libT=t.value;libN=60;fillLib();return}
 if(R&&t.dataset.f=='n'){const{d,x}=t.dataset,ex=R.days[d].ex[x];let v=t.value.trim();const c=findEx(v);if(c&&c.es!=v){v=c.es;t.value=v}ex.n=v;const row=t.closest('.rw');row.querySelector('.tc').innerHTML=thumb(v);
  if(c&&!ex.m){ex.m=GN[c.g];row.querySelector('[data-f="m"]').value=ex.m}}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const{a,d,x,id,code}=t.dataset,T=tab=='c';
 const sure=()=>{if(t.dataset.sure)return 0;t.dataset.sure=1;t.textContent='¿Seguro?';return 1};
 switch(a){
 case'ex':showEx(t.dataset.n);break;
 case'xm':$('#mdl').style.display='none';break;
 case'more':libN+=60;fillLib();break;
 case'tab':tab=t.dataset.t;R=rid=null;rname='';adminView();break;
 case'pick':cur=clients.find(c=>c.id==id);G0={goal:cur.goal,level:cur.level,sex:cur.sex,days:cur.days,place:cur.place,split:'auto'};R=rid=null;rname='';adminView();break;
 case'new':R=rid=null;rname='';adminView();break;
 case'gen':{const av=new Set();if(T&&cur)rts.slice(0,2).forEach(r=>((r.data&&r.data.days)||[]).forEach(dd=>dd.ex.forEach(ee=>av.add(ee.n))));
  R=gen({...G0,avoid:av});rid=null;rname=T?'Rutina '+G0.goal:'Plantilla '+G0.goal+' '+G0.days+' días';await adminView();toast(R.msg||'Rutina generada (división: '+R.split+'). Revísala, edítala y guárdala.');break}
 case'blank':R={rest:'',note:'',days:[{name:'Día 1',note:'',ex:[]}]};rid=null;rname='';adminView();break;
 case'lt':{const p=tpls.find(z=>z.id==$('#tp').value);if(!p)return toast('Elige una plantilla primero');R=copy(p.routine);rid=null;rname=p.name;await adminView();toast('Plantilla cargada como rutina nueva. Guárdala para asignarla.');break}
 case'openR':{const r=rts.find(z=>z.id==id);R=copy(r.data);rid=r.id;rname=r.name;adminView();break}
 case'openT':{const p=tpls.find(z=>z.id==id);R=copy(p.routine);rid=p.id;rname=p.name;adminView();break}
 case'save':{if(busy)return;if(!R)return toast('Primero crea o genera una rutina');const name=($('#rn').value||'').trim()||'Sin nombre';rname=name;busy=1;t.disabled=true;
  const tb=T?'routines':'templates',p=T?{name,data:R}:{name,routine:R};if(T&&!rid)p.client_id=cur.id;
  const q=rid?await sb.from(tb).update(p).eq('id',rid):await sb.from(tb).insert(p).select('id').single();busy=0;
  if(q.error){t.disabled=false;return toast('No se pudo guardar: '+q.error.message)}
  if(!rid)rid=q.data.id;await adminView();toast(T?'Guardada en el perfil de '+cur.full_name:'Plantilla guardada');break}
 case'delR':case'delT':{if(sure())return;await sb.from(a=='delR'?'routines':'templates').delete().eq('id',id);if(rid==id){R=rid=null;rname=''}await adminView();toast('Eliminada');break}
 case'delc':if(sure())return;await sb.from('profiles').delete().eq('id',cur.id);cur=null;R=rid=null;await adminView();toast('Cliente eliminado');break;
 case'inv':{await sb.from('invites').insert({code:Math.random().toString(36).slice(2,10)});await adminView();toast('Link creado');break}
 case'delinv':await sb.from('invites').delete().eq('code',code);adminView();break;
 case'addD':R.days.push({name:'Día '+(R.days.length+1),note:'',ex:[]});redraw();break;
 case'delD':R.days.splice(d,1);redraw();break;
 case'addE':R.days[d].ex.push({m:'',n:'',s:'3',r:'10-12',d:'60-90 s',t:''});redraw();break;
 case'delE':R.days[d].ex.splice(x,1);redraw();break;
 }});
init();
</script>
</body>
</html>
