   const c=cands[0];used.add(c.es);log.push(`"${x.n}" → "${c.es}" (${w}).`);out.push({...x,m:GN[c.g],n:c.es})});
  d.ex=out});

function lineChart(pts,unit){
 if(pts.length<2)return`<div class="mut" style="padding:18px 0">${pts.length?'Registra una segunda medición para ver la gráfica.':'Aún no hay mediciones de esto.'}</div>`;
 const W=600,H=230,L=46,R=16,T=16,B=32,xs=pts.map(p=>dparse(p.d).getTime()),x0=xs[0],x1=xs[xs.length-1],ys=pts.map(p=>p.v);
 let lo=Math.min(...ys),hi=Math.max(...ys);const pad=(hi-lo)*.2||1;lo-=pad;hi+=pad;
 const X=t=>L+(x1==x0?0:(t-x0)/(x1-x0))*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 const tk=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);

 const last=pts[pts.length-1],first=pts[0];
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de ${unit}">`+
  tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${f1(v)}</text>`).join('')+
  `<path class="l" d="${path}"/>`+pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"><title>${fd(dparse(p.d))}: ${f1(p.v)} ${unit}</title></circle>`).join('')+
  `<text x="${L}" y="${H-8}">${fd(dparse(first.d))}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fd(dparse(last.d))}</text>`+
  `<text x="${X(xs[xs.length-1]).toFixed(1)}" y="${(Y(last.v)-9).toFixed(1)}" text-anchor="end" class="lb">${f1(last.v)} ${unit}</text></svg>`}

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||!/^fl_/.test(t.dataset.a))return;const a=t.dataset.a,id=t.dataset.id;
 const upd=async(cid,up)=>{const r=await sb.from('profiles').update(up).eq('id',cid);if(r.error){toast('No se pudo guardar: '+r.error.message);return false}const c=clients.find(x=>x.id==cid);if(c)Object.assign(c,up);if(cur&&cur.id==cid)Object.assign(cur,up);return true};
 switch(a){
 case'fl_pay':{const u=payLink(t.dataset.c,me.id);if(!u)return toast('Escríbele a tu asesor para pagar');location.href=u;break}
 case'fl_chk':window.__pt=0;await boot();break;
 case'fl_note':{const b=($('#cnote').value||'').trim();if(!b)return;const r=await sb.from('client_notes').insert({client_id:me.id,kind:'cliente',body:b.slice(0,1500)});if(r.error)return toast('No se pudo guardar: '+r.error.message);await loadMyNotes();toast('Nota guardada');clientAccount();break}
 case'fl_anote':{const b=($('#anote').value||'').trim();if(!b||!cur)return;const r=await sb.from('client_notes').insert({client_id:cur.id,kind:'admin',body:b.slice(0,1500)});if(r.error)return toast('No se pudo guardar: '+r.error.message);await loadFlow();keepY(render);toast('Nota guardada');break}
 case'fl_delnote':{const r=await sb.from('client_notes').delete().eq('id',id);if(r.error)return toast(r.error.message);await loadFlow();keepY(render);break}
 case'fl_open':{cur=clients.find(c=>c.id==id);tab='c';ptab='res';await adminView();scrollTo(0,0);break}
 case'fl_start':{const v=($('#st_'+id)||{}).value;if(!v)return;const c=clients.find(x=>x.id==id),end=endFor(v,c.plan_type)||c.plan_end,up={plan_start:v,plan_end:end,period_start:v};if(dparse(v).getDay()!=1)toast('Ojo: esa fecha no es lunes');if(await upd(id,up)){if(c.partner_id&&isDua(c))await upd(c.partner_id,up);keepY(render);toast('Inicio fijado: '+fdm(v))}break}
 case'fl_paid':{const c=clients.find(x=>x.id==id),b=c.service=='basico',st=todayISO(),up=b?{pay_status:'pagado',access:true,paid_at:new Date().toISOString(),plan_start:st,period_start:st,plan_end:addDays(st,27)}:{pay_status:'pagado',access:true,paid_at:new Date().toISOString(),needs_plan:true};if(await upd(id,up)){keepY(render);toast('Pago marcado como recibido')}break}
 case'fl_done':{const c=clients.find(x=>x.id==id),ci=cycleInfo(c),up={needs_plan:false};if(c.plan_type=='anual'&&ci&&!ci.pre)up.cycle_done=ci.cycle+1;if(await upd(id,up)){keepY(render);toast('Marcado: plan listo')}break}
 case'fl_code':{const cc=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');const r=await sb.from('invites').insert({code:cc,note:'cortesia',admin:false});if(r.error)return toast('No se pudo crear: '+r.error.message);window.__cc=cc;keepY(render);toast('Código creado. Copia el link y envíalo (sirve una sola vez)');break}
 case'fl_savelinks':{for(const k of ['basico','pers_m','pers_m_dua','pers_a','pers_a_dua']){const v=($('#pl_'+k)||{}).value||'';if(v&&v!==PAYL[k]||SET['pay_'+k]){const r=await sb.from('app_settings').upsert({key:'pay_'+k,value:v.trim()});if(r.error)return toast('No se pudo guardar: '+r.error.message);SET['pay_'+k]=v.trim()}}toast('Links guardados');break}
 }});

const EXD={"Press de banca plano con barra":"Acuéstate con los pies firmes en el suelo y los omóplatos juntos. Baja la barra controlada al pecho y empújala hacia arriba sin rebotar. Evita despegar la espalda del banco.","Press inclinado con barra":"En un banco inclinado, baja la barra a la parte alta del pecho y empuja hacia arriba. Codos a unos 45° del cuerpo. Evita arquear la espalda en exceso.","Press declinado con barra":"En banco declinado, baja la barra a la parte baja del pecho y empuja hasta estirar los brazos. Pide ayuda para sacar la barra del soporte. Controla siempre la bajada.","Press de banca agarre ancho con barra":"Con las manos más abiertas que los hombros, baja la barra al pecho con control y empuja. Mantén las muñecas rectas y no bajes a la altura del cuello.","Press plano con mancuernas":"Acostado, con una mancuerna en cada mano a la altura del pecho, empuja hacia arriba juntándolas arriba. Baja lento hasta sentir estiramiento en el pecho. No choques las mancuernas.","Press plano con mancuernas agarre neutro":"Igual que el press con mancuernas pero con las palmas mirando una a la otra. Baja con los codos cerca del cuerpo. Es amable con los hombros.","Press inclinado con mancuernas":"En banco inclinado, empuja las mancuernas desde la altura del pecho hasta estirar los brazos. Baja controlado. Evita arquear la zona lumbar.","Press inclinado con mancuernas agarre martillo":"En banco inclinado con las palmas mirándose, empuja hacia arriba y baja lento manteniendo los codos pegados al cuerpo. Buena opción si los hombros se quejan.","Press declinado con mancuernas":"En banco declinado, empuja las mancuernas hacia arriba desde la parte baja del pecho. Baja lento y mantén las muñecas firmes.","Press de pecho a un brazo con mancuerna":"Acostado, empuja una mancuerna a la vez desde el pecho. Aprieta el abdomen para que el cuerpo no gire. Cambia de lado al terminar las repeticiones.","Press de pecho en máquina":"Siéntate con la espalda pegada, agarra las manijas a la altura del pecho y empuja hasta estirar los brazos. Regresa lento sin soltar el peso de golpe.","Press de pecho en máquina de palanca":"Sentado con la espalda apoyada, empuja las manijas al frente sin despegar los hombros del respaldo. Controla el regreso.","Press inclinado en máquina de palanca":"Sentado en la máquina inclinada, empuja las manijas hacia arriba y al frente. Mantén los hombros hacia abajo y atrás.","Press de banca en máquina Smith":"Acostado bajo la barra guiada, desbloquéala, baja al pecho y empuja. Los pies firmes. Úsala con cuidado de apoyar bien la espalda.","Press inclinado en máquina Smith":"En banco inclinado bajo la barra guiada, baja a la parte alta del pecho y empuja. Controla la bajada y no estires los codos de golpe.","Press de pecho en polea":"De pie entre poleas, agarra las manijas y empuja al frente juntando las manos. Abdomen firme y un pie adelante. Regresa lento.","Press inclinado en polea":"De pie con las poleas abajo, empuja hacia arriba y al frente. Mantén el pecho abierto y el cuerpo estable.","Aperturas con mancuernas":"Acostado, con los brazos abiertos y codos ligeramente flexionados, baja las mancuernas en arco hasta sentir estiramiento y regresa apretando el pecho. No estires del todo los codos.","Aperturas inclinadas con mancuernas":"En banco inclinado, abre los brazos en arco con codos suaves y regresa juntando las mancuernas arriba. Usa poco peso y baja controlado.","Aperturas declinadas con mancuernas":"En banco declinado, abre en arco con los codos semiflexionados y cierra apretando el pecho. Movimiento lento y sin rebotes.","Aperturas en polea en banco plano":"Acostado en banco con una polea en cada lado, abre los brazos en arco y júntalos sobre el pecho. Codos suaves y movimiento lento.","Aperturas inclinadas en polea":"En banco inclinado con poleas bajas, junta las manos hacia arriba del pecho en arco. Mantén los codos ligeramente flexionados.","Cruces en polea alta":"De pie entre poleas altas, lleva las manos hacia abajo y al frente cruzándolas. Inclínate un poco al frente y aprieta el pecho.","Cruces en polea baja":"De pie con poleas bajas, sube las manos en arco hasta la altura del pecho. Mantén el tronco firme y los codos suaves.","Peck deck (contractora de pecho)":"Sentado con la espalda pegada, junta las manijas al frente apretando el pecho. Regresa lento sin que el peso se asiente. No encojas los hombros.","Fondos en paralelas (énfasis pecho)":"Sostente en las barras con el cuerpo inclinado al frente, baja doblando los codos hacia los lados y empuja para subir. Baja hasta sentir estiramiento sin dolor en el hombro.","Pullover con mancuerna (brazos flexionados)":"Acostado en el banco con una mancuerna sobre el pecho, llévala detrás de la cabeza con los codos flexionados y regresa. Siente el estiramiento en el pecho y la espalda.","Pullover con mancuerna (brazos rectos)":"Acostado, lleva la mancuerna con brazos casi rectos por encima de la cabeza hasta sentir estiramiento y regresa al pecho. Abdomen firme.","Press de suelo a un brazo con kettlebell":"Acostado en el suelo con un kettlebell en una mano, empuja hacia arriba desde el pecho. El codo apoya en el suelo abajo. Mantén la muñeca recta.","Flexiones (push-ups)":"Manos un poco más abiertas que los hombros y cuerpo recto como tabla. Baja el pecho al suelo y empuja. No dejes caer la cadera.","Flexiones con agarre ancho":"Con las manos bien abiertas, baja el pecho al suelo manteniendo el cuerpo recto y empuja. Si molestan los hombros, acércalas un poco.","Flexiones con pies elevados":"Con los pies sobre un banco o silla, baja el pecho al suelo con el cuerpo recto y empuja. Trabaja más la parte alta del pecho. No hundas la cadera.","Flexiones inclinadas (manos elevadas)":"Con las manos sobre un banco o pared firme, baja el pecho y empuja. Es una versión más fácil. Mantén el cuerpo recto.","Flexiones declinadas":"Con los pies más altos que las manos, baja con control y empuja. Es una versión difícil: no dejes caer la cadera ni arquees la espalda.","Flexión a un brazo":"Una mano apoyada y la otra a la espalda, pies abiertos para equilibrar. Baja con control y empuja. Es muy avanzado; empieza con las versiones más fáciles.","Flexiones en reloj":"En posición de flexión, baja el pecho y al subir desplaza el cuerpo hacia un lado como las manecillas de un reloj. Movimiento controlado y abdomen apretado.","Flexión con giro a plancha lateral":"Haz una flexión y al subir gira el cuerpo hacia un lado abriendo un brazo al techo, quedando en plancha lateral. Alterna lados.","Press de pecho con banda":"Con la banda anclada detrás, empuja las manos al frente hasta estirar los brazos y regresa lento. Manten el abdomen firme y los codos a media altura.","Cruces de pecho con banda":"Con la banda anclada detrás y los brazos abiertos, junta las manos al frente apretando el pecho. Regresa lento con los codos suaves.","Jalón al pecho agarre ancho":"Sentado, agarra la barra más abierta que los hombros y jala hasta la parte alta del pecho llevando los codos hacia abajo. No te columpies. Controla la subida.","Jalón al pecho agarre cerrado":"Sentado con agarre cerrado, jala hacia el pecho llevando los codos atrás y abajo. Pecho arriba y sin impulso.","Jalón con agarre en V (neutro)":"Con el agarre en V y palmas mirándose, jala hacia el pecho acercando los codos al cuerpo. Regresa lento hasta estirar los brazos.","Jalón agarre supino":"Con las palmas mirando hacia ti, jala la barra al pecho. Trabaja más el bíceps. Hombros abajo y sin impulso.","Jalón a un brazo en polea":"Sentado, jala una sola manija hacia el pecho llevando el codo abajo y atrás. Mantén el tronco estable y alterna lados.","Pulldown con brazos rectos":"De pie frente a la polea alta con los brazos casi rectos, jala la barra hacia los muslos con la espalda activa. Codos suaves y tronco firme.","Pulldown con brazos rectos y cuerda":"De pie frente a la polea alta con cuerda, baja los brazos casi rectos hacia los muslos separando la cuerda al final. Siente trabajar los dorsales.","Dominadas pronas (agarre ancho)":"Cuélgate con las manos más abiertas que los hombros y sube hasta pasar la barbilla de la barra. Baja controlado hasta estirar los brazos. No te columpies.","Dominadas supinas":"Con las palmas hacia ti y manos a la anchura de los hombros, sube hasta pasar la barbilla de la barra y baja lento. Trabaja bíceps y espalda.","Dominadas con agarre neutro":"Con las palmas mirándose, sube hasta que la barbilla pase las manijas y baja lento. Es cómoda para hombros y codos.","Dominadas asistidas con banda":"Pon una banda en la barra y apoya la rodilla o pie en ella para que te ayude a subir. Sube hasta la barbilla y baja lento. Reduce la ayuda poco a poco.","Dominadas con peso":"Con un cinturón de peso, haz la dominada completa: sube hasta pasar la barbilla y baja lento. Solo con técnica limpia.","Remo con barra inclinado":"Con la espalda recta e inclinada hacia adelante, jala la barra hacia el abdomen llevando los codos atrás. No redondees la espalda ni te impulses.","Remo con barra agarre supino":"Inclinado con la espalda recta y palmas hacia arriba, jala la barra al abdomen. Codos pegados al cuerpo. Evita usar impulso.","Remo con dos mancuernas inclinado":"Inclinado con una mancuerna en cada mano, jala ambas hacia las costillas juntando los omóplatos. Espalda recta y cuello neutro.","Remo con mancuerna a una mano":"Apoya una mano y rodilla en el banco, jala la mancuerna hacia la cadera con el codo cerca del cuerpo. Evita girar el tronco.","Remo con mancuernas en banco inclinado":"Boca abajo sobre un banco inclinado, jala las mancuernas hacia las costillas juntando los omóplatos. Pecho apoyado y cuello relajado.","Remo sentado en polea baja":"Sentado con los pies firmes, jala el agarre al abdomen y junta los omóplatos. Regresa lento. No te balancees con la espalda.","Remo en polea elevado":"Sentado frente a una polea alta, jala hacia el pecho o abdomen llevando los codos atrás. Pecho arriba y sin impulso.","Remo en polea a un brazo":"Jala una sola manija hacia la cadera juntando el omóplato. Tronco estable y sin rotar. Regresa lento.","Remo en polea alta de rodillas":"De rodillas frente a la polea alta, jala el agarre hacia el abdomen con la espalda recta. Controla el regreso.","Remo alto en máquina":"Sentado con el pecho apoyado, jala las manijas hacia ti llevando los codos atrás y juntando los omóplatos. Regresa lento.","Remo en máquina de palanca":"Con el pecho apoyado, jala las manijas hacia el abdomen. Codos atrás y hombros abajo. No te impulses con el cuerpo.","Remo en T con barra":"Con la barra anclada, inclina el torso con espalda recta y jala hacia el pecho. Rodillas ligeramente flexionadas. Evita redondear la espalda.","Remo en T apoyado en pecho":"Con el pecho apoyado en la almohadilla, jala las manijas hacia ti juntando los omóplatos. Regresa lento hasta estirar.","Remo inclinado en Smith":"Inclinado con la espalda recta, jala la barra guiada hacia el abdomen. Controla el regreso y evita redondear la espalda.","Remo invertido (barra baja o mesa firme)":"Acostado bajo una barra baja o mesa firme, jala el pecho hacia ella con el cuerpo recto. Baja controlado. Mantén cadera arriba.","Remo suspendido (TRX o anillas)":"Con las manos en las cintas y el cuerpo inclinado, jala el pecho hacia las manos manteniendo el cuerpo recto. Cuanto más horizontal, más difícil.","Remo con kettlebell a una mano":"Inclinado con espalda recta, jala el kettlebell hacia la cadera con el codo cerca del cuerpo. Cambia de lado. No gires el tronco.","Remo con dos kettlebells":"Inclinado con la espalda recta y un kettlebell en cada mano, jala ambos hacia la cadera juntando los omóplatos. Regresa lento.","Remo alterno con kettlebell":"En posición de plancha con kettlebells en las manos, jala uno hacia la cadera sin girar el cuerpo y alterna. Abdomen muy firme.","Remo en banco inclinado con barra":"Inclinado con la espalda recta y la barra bajo el pecho apoyada en banco, jala la barra hacia el abdomen. Controla el regreso.","Pullover con barra (brazos flexionados)":"Acostado en el banco, lleva la barra por detrás de la cabeza con los brazos casi rectos y regresa al pecho. Siente el estiramiento en el torso.","Peso muerto convencional":"Con los pies al ancho de la cadera y la barra pegada a las piernas, sube estirando cadera y rodillas con la espalda recta. Baja controlado. No redondees la espalda.","Rack pull (peso muerto desde pines)":"La barra sobre pines a la altura de la rodilla; sube estirando la cadera con la espalda recta y baja controlado. Menos recorrido que el peso muerto.","Hiperextensiones (extensión lumbar)":"Con la cadera apoyada en el banco, baja el torso con espalda recta y sube hasta que el cuerpo quede alineado. No te pases hacia atrás.","Extensión lumbar en suelo con peso corporal":"Boca abajo en el suelo, levanta el pecho con control apretando la espalda baja y los glúteos. Baja despacio. Sin forzar el cuello.","Superman (extensión lumbar en suelo)":"Boca abajo, levanta brazos y piernas a la vez, mantén un segundo y baja despacio. Mira al suelo para no forzar el cuello.","Press militar de pie con barra":"De pie con la barra a la altura de los hombros, empuja hacia arriba hasta estirar los brazos. Abdomen y glúteos firmes. No arquees la espalda baja.","Press de hombros con barra":"Con la barra a la altura de los hombros, empuja hasta estirar los brazos sobre la cabeza y baja controlado. Mantén el torso firme.","Press militar sentado con barra":"Sentado con la espalda apoyada, empuja la barra desde los hombros hasta arriba y baja lento. Abdomen firme.","Press de hombros con mancuernas":"Con una mancuerna a cada lado de los hombros, empuja hacia arriba hasta casi juntarlas y baja lento. No arquees la espalda.","Press de hombros sentado con mancuernas":"Sentado con respaldo, empuja las mancuernas desde los hombros hacia arriba y baja controlado. Evita arquear la espalda.","Press de hombros de pie con mancuernas":"De pie con abdomen firme, empuja las mancuernas desde los hombros hasta arriba y baja lento. No arquees la zona lumbar.","Press Arnold con mancuernas":"Empieza con las mancuernas frente al pecho y las palmas hacia ti; al subir gira las palmas al frente y empuja. Baja girando de regreso. Movimiento fluido.","Press de hombro a un brazo con mancuerna":"Con una mancuerna a la altura del hombro, empuja hacia arriba y baja lento. Abdomen firme para no inclinarte. Cambia de lado.","Press de hombros en máquina":"Sentado con la espalda apoyada, empuja las manijas hacia arriba sin encoger los hombros y baja lento.","Press de hombros en máquina de palanca":"Sentado con la espalda apoyada, empuja las manijas hacia arriba hasta estirar los brazos. Controla la bajada.","Press de hombros en Smith":"Sentado bajo la barra guiada, empuja hacia arriba y baja hasta la altura de la barbilla. Espalda apoyada.","Press de hombros en polea":"Sentado o de pie frente a la polea, empuja hacia arriba y baja lento. Abdomen firme y movimiento controlado.","Press de hombros con banda":"Pisa la banda y empuja hacia arriba desde los hombros hasta estirar los brazos. Abdomen firme. Regresa lento.","Press de hombros sentado con kettlebell":"Sentado con un kettlebell por los cuernos o a una mano, empuja hacia arriba y baja lento. Muñeca recta y abdomen firme.","Press militar con dos kettlebells":"De pie con un kettlebell en cada hombro, empuja ambos hacia arriba y baja controlado. Abdomen y glúteos firmes.","Elevaciones laterales con mancuernas":"De pie, sube las mancuernas hacia los lados hasta la altura de los hombros con los codos suaves y baja lento. Sin impulso ni encogerte.","Elevaciones laterales sentado con mancuernas":"Sentado, sube las mancuernas hacia los lados hasta la altura de los hombros con codos suaves. Baja lento y sin impulso.","Elevaciones laterales sentado en polea":"Sentado de lado a la polea baja, sube la manija hacia el lado hasta el hombro y baja lento. Tensión constante y sin impulso.","Elevaciones laterales en polea baja":"De pie junto a la polea baja, sube la manija hacia el lado hasta el hombro con el codo suave y baja lento.","Elevaciones laterales a un brazo":"De pie con una mancuerna, sube el brazo hacia el lado hasta el hombro y baja lento. Puedes sujetarte con la otra mano. Sin impulso.","Elevaciones laterales con banda":"Pisa la banda y sube los brazos hacia los lados hasta la altura de los hombros con los codos suaves. Baja lento.","Elevaciones frontales con mancuernas":"De pie, sube las mancuernas al frente hasta la altura de los ojos con brazos casi rectos y baja lento. Sin impulso.","Elevaciones frontales en polea":"De espaldas a la polea baja, sube la manija al frente hasta la altura de los hombros y baja lento. Tronco firme.","Pájaros (aperturas posteriores) con mancuernas":"Inclinado con la espalda recta, abre los brazos hacia los lados con los codos suaves llevando las mancuernas hasta la altura de los hombros. Sin impulso.","Pájaro sentado inclinado con mancuernas":"Sentado e inclinado hacia adelante, abre los brazos hacia los lados con los codos suaves y regresa lento. Espalda recta.","Pájaro con pecho apoyado en banco":"Con el pecho apoyado en un banco inclinado, abre los brazos hacia los lados con codos suaves. Baja lento y sin impulso.","Pájaro en polea (deltoides posterior)":"Con poleas cruzadas, jala las manijas hacia los lados y atrás con los brazos casi rectos apretando la parte trasera del hombro. Regresa lento.","Peck deck inverso (deltoides posterior)":"Sentado de frente al respaldo, abre los brazos hacia atrás con los codos suaves apretando la parte trasera del hombro. Regresa lento.","Face pull en polea":"Con la cuerda a la altura del rostro, jala hacia la cara abriendo los codos y juntando los omóplatos. Regresa lento. Buen ejercicio para postura y hombros.","Apertura de banda (band pull-apart)":"Con una banda al frente, ábrela llevando las manos hacia los lados hasta el pecho y regresa lento. Hombros abajo y brazos casi rectos.","Pájaro con banda":"Con la banda sujeta al frente, abre los brazos hacia los lados juntando los omóplatos. Regresa lento y sin encoger los hombros.","Remo al mentón con barra":"De pie con la barra en los muslos, súbela pegada al cuerpo hasta el pecho con los codos arriba y baja lento. No subas más allá de la altura del pecho si te molesta el hombro.","Remo para deltoides posterior con barra":"Inclinado con espalda recta, jala la barra hacia el pecho con los codos abiertos a los lados. Trabaja la parte trasera del hombro. Sin impulso.","Elevación en plano de la escápula (scaption)":"De pie, sube los brazos al frente y ligeramente hacia afuera a unos 30° hasta la altura de los hombros con los pulgares arriba. Baja lento.","Rotación externa con banda (manguito rotador)":"Con el codo pegado al cuerpo y doblado a 90°, gira el antebrazo hacia afuera contra la banda y regresa lento. Con poca resistencia, buena para el hombro.","Cuban press con mancuernas":"De pie con mancuernas, súbelas pegadas al cuerpo hasta el pecho, gira los brazos hacia arriba y empuja sobre la cabeza. Baja con el mismo recorrido. Poco peso.","Flexiones en pino (parado de manos)":"Con la espalda cerca de la pared y las manos en el suelo, baja la cabeza al suelo y empuja. Solo si dominas el equilibrio; usa pared de apoyo.","Encogimientos con barra":"De pie con la barra en los muslos, sube los hombros hacia las orejas, pausa y baja lento. Sin girar los hombros.","Encogimientos con mancuernas":"De pie con una mancuerna en cada mano, sube los hombros hacia las orejas, pausa y baja lento. Sin girar los hombros.","Encogimientos en polea":"De pie frente a la polea baja, sube los hombros hacia las orejas, pausa y baja lento. Brazos relajados.","Encogimientos en máquina":"Sentado o de pie, agarra las manijas y sube los hombros hacia las orejas con pausa. Baja lento sin soltar el peso.","Remo al mentón con mancuernas":"De pie con las mancuernas frente a los muslos, súbelas pegadas al cuerpo hasta el pecho con los codos arriba. Baja lento. No subas por encima de los hombros.","Remo al mentón en polea":"De pie frente a la polea baja, sube la barra o cuerda pegada al cuerpo hasta el pecho con los codos arriba. Baja lento.","Remo al mentón con banda":"Pisa la banda y sube las manos pegadas al cuerpo hasta el pecho con los codos arriba. Baja lento y sin impulso.","Sentadilla con barra (trasera)":"Con la barra sobre los trapecios, pies al ancho de los hombros, baja con la espalda recta hasta que los muslos queden paralelos y sube empujando el suelo. Rodillas en línea con los pies.","Sentadilla profunda con barra":"Con la barra sobre la espalda alta, baja lo más profundo que puedas con la espalda recta y sin despegar talones. Sube empujando con todo el pie.","Sentadilla frontal con barra":"Con la barra apoyada en la parte frontal de los hombros y codos altos, baja con el torso erguido y sube. Trabaja más los cuádriceps.","Sentadilla con barra, postura ancha":"Con los pies bien abiertos y puntas hacia afuera, baja con la espalda recta y sube. Trabaja más glúteos y aductores. Rodillas siguen la dirección de los pies.","Sentadilla a cajón con barra":"Baja hasta sentarte en un cajón o banco con control, sin soltarte, y sube empujando el suelo. Mantén la espalda recta.","Sentadilla en Smith":"Con la barra guiada, pies un poco adelante, baja con el torso recto y sube. Úsala con las rodillas alineadas con los pies.","Sentadilla hack en máquina":"Con la espalda apoyada en la máquina, baja doblando las rodillas y sube empujando con todo el pie. No bloquees las rodillas arriba.","Prensa de piernas 45°":"Sentado con la espalda apoyada, baja la plataforma doblando las rodillas sin que la cadera se despegue y empuja. No bloquees las rodillas al estirar.","Prensa de piernas con pies juntos":"En la prensa, con los pies juntos al centro, baja con control y empuja sin bloquear las rodillas. Cuida que la zona lumbar no se despegue.","Sentadilla acostada en máquina":"Con la espalda apoyada en la máquina inclinada, baja doblando las rodillas y empuja sin bloquear. Espalda pegada todo el tiempo.","Extensiones de cuádriceps en máquina":"Sentado con el cojín sobre los tobillos, estira las rodillas hasta arriba y baja lento. Aprieta el muslo al final. Sin impulso.","Extensión de cuádriceps a una pierna":"Sentado, estira una sola pierna hasta arriba y baja lento. Aprieta el muslo al final. Cambia de lado.","Sentadilla goblet":"Sostén una mancuerna o kettlebell pegada al pecho, baja con el torso erguido y sube. Codos hacia adentro entre las rodillas.","Sentadilla con mancuernas":"Con una mancuerna en cada mano a los lados, baja con la espalda recta hasta que los muslos queden paralelos y sube. Rodillas en línea con los pies.","Sentadilla sumo (plié) con mancuerna":"Pies muy abiertos con una mancuerna colgando entre las piernas, baja con la espalda recta y sube apretando glúteos. Rodillas siguen los pies.","Sentadilla a banco con mancuernas":"Baja hasta tocar ligeramente un banco con los glúteos, sin sentarte del todo, con mancuernas a los lados. Sube con control.","Sentadilla frontal con dos kettlebells":"Con un kettlebell en cada hombro y el torso erguido, baja y sube con control. Codos altos y abdomen firme.","Sentadilla dividida con mancuernas":"Con un pie adelante y el otro atrás, baja la rodilla trasera hacia el suelo con mancuernas a los lados y sube. Torso recto y rodilla delantera sobre el pie.","Sentadilla dividida (split squat)":"Un pie adelante y otro atrás, baja doblando ambas rodillas con el torso recto y sube. Cambia de pierna. Rodilla delantera alineada con el pie.","Sentadilla dividida en Smith":"Con un pie adelante y otro atrás bajo la barra guiada, baja la rodilla trasera y sube empujando con el pie delantero. Torso recto.","Zancadas con mancuernas":"Da un paso al frente, baja la rodilla trasera hacia el suelo con mancuernas a los lados y regresa. Torso recto. Alterna piernas.","Zancada inversa con mancuernas":"Da un paso atrás, baja la rodilla trasera hacia el suelo con mancuernas a los lados y regresa. Torso recto. Más amable con la rodilla.","Zancada con barra":"Con la barra sobre los hombros, da un paso al frente, baja la rodilla trasera y regresa empujando. Torso recto y abdomen firme.","Zancadas caminando con barra":"Con la barra sobre los hombros, camina alternando pasos largos y bajando la rodilla trasera. Torso recto y pasos controlados.","Zancadas caminando sin peso":"Camina dando pasos largos y baja la rodilla trasera hacia el suelo en cada paso. Torso recto y mirada al frente.","Zancada trasera elevada con barra":"Con el pie trasero elevado en un banco y la barra al hombro, baja doblando la pierna delantera y sube. Torso recto. Cambia de lado.","Step-ups con mancuernas":"Con una mancuerna en cada mano, sube a un cajón con un pie empujando con ese talón y baja controlado. No te impulses con la otra pierna.","Step-ups con barra":"Con la barra sobre los hombros, sube a un cajón empujando con el talón y baja controlado. Alterna piernas.","Sentadilla con peso corporal":"Pies al ancho de los hombros, baja llevando la cadera atrás con la espalda recta y sube. Brazos al frente para equilibrio. Rodillas siguen los pies.","Sentadilla con salto":"Baja en sentadilla y salta explosivamente hacia arriba, aterrizando suave con las rodillas flexionadas. Evita si tienes dolor de rodillas.","Sentadilla con banda":"Pisa la banda y colócala sobre los hombros; baja en sentadilla y sube contra la resistencia. Espalda recta y rodillas abiertas.","Sentadilla pistol con kettlebell":"De pie sobre una pierna con un kettlebell al frente, baja a una sentadilla profunda con la otra pierna extendida y sube. Es avanzado; usa apoyo al inicio.","Peso muerto rumano con barra":"Con la barra frente a los muslos, lleva la cadera hacia atrás con las rodillas casi rectas hasta sentir estirar los femorales y sube. Espalda recta y barra pegada a las piernas.","Peso muerto con piernas rígidas (barra)":"Con las piernas casi rectas, baja la barra pegada a las piernas inclinando el torso y sube con la cadera. Espalda recta, sin redondear.","Peso muerto rumano con mancuernas":"Con una mancuerna en cada mano frente a los muslos, lleva la cadera atrás y baja pegadas a las piernas, y sube apretando glúteos. Espalda recta.","Peso muerto rumano en Smith":"Con la barra guiada, lleva la cadera atrás con las rodillas casi rectas y sube. Espalda recta y barra cerca de las piernas.","Buenos días con barra":"Con la barra sobre los hombros y las rodillas ligeramente flexionadas, inclina el torso hacia adelante con espalda recta y sube. Poco peso y técnica limpia.","Curl femoral tumbado en máquina":"Boca abajo, flexiona las rodillas llevando el cojín hacia los glúteos y baja lento. Cadera pegada al banco. Sin impulso.","Curl femoral sentado en máquina":"Sentado con el cojín sobre los tobillos, flexiona las rodillas hacia abajo y regresa lento. Espalda apoyada y sin impulso.","Curl femoral de pie a una pierna":"De pie, flexiona una rodilla llevando el talón hacia el glúteo contra la resistencia y baja lento. Cadera estable.","Curl femoral con pelota de ejercicio":"Acostado con los talones sobre la pelota, sube la cadera y rueda la pelota hacia los glúteos flexionando las rodillas. Regresa lento.","Elevación glúteo-femoral (GHR) en máquina":"Con las piernas fijas en la máquina, baja el torso y sube usando femorales y glúteos. Espalda recta. Movimiento controlado.","Elevación glúteo-femoral natural (sin máquina)":"Arrodillado con los tobillos sujetos, baja el torso hacia adelante lo más lento posible y sube ayudándote con las manos si es necesario. Muy exigente.","Elevación glúteo-femoral en suelo":"Acostado boca arriba con los pies fijos, sube la cadera y acerca los talones hacia los glúteos. Baja lento.","Deslizamientos de femoral con toalla":"Acostado boca arriba con los talones sobre una toalla en suelo liso, sube la cadera y desliza los talones hacia los glúteos. Regresa lento.","Curl femoral sentado con banda":"Sentado con la banda en los tobillos, flexiona las rodillas jalando hacia atrás y regresa lento. Espalda recta.","Peso muerto a una pierna con kettlebell":"De pie sobre una pierna con un kettlebell, inclina el torso llevando la otra pierna atrás y sube. Espalda recta. Cambia de lado.","Swing con kettlebell a un brazo":"Con el kettlebell entre las piernas, empuja la cadera hacia adelante y balancéalo hasta la altura del pecho. Espalda recta. El movimiento sale de la cadera, no de los brazos.","Hiperextensión inversa":"Boca abajo con las piernas fuera del banco, sube las piernas con control hasta alinearlas con el cuerpo y baja lento. Sin balancearte.","Buenos días con banda":"Con la banda bajo los pies y sobre la nuca, inclina el torso con espalda recta llevando la cadera atrás y sube. Rodillas ligeramente flexionadas.","Peso muerto sumo":"Con pies muy abiertos y manos dentro de las rodillas, sube estirando cadera y rodillas con la espalda recta. Barra pegada al cuerpo.","Hip thrust con barra":"Con la espalda alta apoyada en un banco y la barra sobre la cadera, empuja con los glúteos hasta alinear el torso y baja controlado. Barbilla pegada y sin arquear la espalda.","Puente de glúteo con barra":"Acostado con la barra sobre la cadera y los pies firmes, sube apretando glúteos hasta alinear rodillas, cadera y hombros. Baja lento.","Puente de glúteo (peso corporal)":"Acostado con las rodillas dobladas y los pies firmes, sube la cadera apretando glúteos hasta alinear el cuerpo. Baja lento.","Puente de glúteo a una pierna":"Acostado con una pierna extendida, sube la cadera con la otra apretando glúteos y baja lento. Cadera nivelada.","Patada de glúteo en cuadrupedia":"En cuadrupedia, lleva una pierna hacia atrás y arriba apretando el glúteo y baja sin tocar el suelo. Espalda neutra, sin arquear.","Patada de glúteo en polea":"Con la tobillera en la polea baja, lleva la pierna hacia atrás apretando el glúteo y regresa lento. Torso estable.","Abducción de cadera en máquina":"Sentado, abre las piernas contra la resistencia apretando los glúteos y regresa lento. Espalda apoyada.","Pull-through en polea (bisagra de cadera)":"De espaldas a la polea baja con la cuerda entre las piernas, empuja la cadera hacia adelante hasta ponerte erguido y regresa llevándola atrás. Espalda recta.","Extensión de cadera con banda":"Con la banda en los tobillos o rodilla, lleva la pierna hacia atrás apretando el glúteo y regresa lento. Cadera estable.","Puente de glúteo con banda":"Acostado con la banda sobre las rodillas, sube la cadera apretando glúteos y empuja las rodillas hacia afuera. Baja lento.","Caminata monstruo con banda (lateral)":"Con la banda sobre las rodillas y las rodillas flexionadas, camina de lado manteniendo la tensión. Pies al frente y torso estable.","Puente de glúteo con pies en pelota":"Acostado con los talones sobre la pelota, sube la cadera apretando glúteos y mantén el equilibrio. Baja lento.","Step-up con elevación de rodilla":"Sube a un cajón con una pierna y al final eleva la otra rodilla. Baja controlado y alterna. Torso erguido.","Elevación de talones de pie en máquina":"De pie en la máquina con el peso sobre los hombros, sube de puntas lo más alto que puedas, pausa y baja estirando bien. Sin rebotar.","Elevación de talones sentado en máquina":"Sentado con el cojín sobre las rodillas, sube los talones lo más alto que puedas, pausa y baja estirando. Sin rebotar.","Elevación de talones en prensa":"Sentado en la prensa con las puntas en el borde de la plataforma, estira los tobillos y baja con estiramiento. Rodillas sin bloquear.","Elevación de talones de pie con barra":"De pie con la barra sobre los hombros, sube de puntas, pausa y baja lento hasta estirar. Equilibrio firme.","Elevación de talones en Smith":"De pie bajo la barra guiada, sube de puntas, pausa y baja hasta estirar bien. Sin rebotes.","Elevación de talones de pie con mancuernas":"De pie con una mancuerna en cada mano, sube de puntas, pausa y baja estirando. Sin rebotes.","Elevación de talones sentado a una pierna con mancuerna":"Sentado con la mancuerna sobre la rodilla, sube el talón, pausa y baja estirando. Cambia de pierna.","Elevación de talones sentado con barra":"Sentado con la barra sobre las rodillas, sube los talones, pausa y baja estirando. Sin rebotes.","Elevación de talones tipo burro":"Inclinado hacia adelante con la cadera flexionada, sube de puntas con peso en la espalda baja y baja estirando. Movimiento controlado.","Elevación de talones con banda":"Pisa la banda con las puntas de los pies y sube de puntas contra la resistencia. Pausa arriba y baja lento.","Curl con barra recta":"De pie con la barra, flexiona los codos llevando la barra a los hombros y baja lento. Codos pegados al cuerpo y sin balancearte.","Curl con barra Z":"De pie con barra Z, flexiona los codos hacia los hombros y baja lento. Codos pegados al cuerpo y sin impulso.","Curl con barra Z agarre cerrado":"Con barra Z y manos juntas, flexiona los codos hacia los hombros y baja lento. Codos pegados y sin impulso.","Curl con barra agarre ancho":"Con las manos más abiertas que los hombros, flexiona los codos y sube la barra. Codos pegados al cuerpo y baja lento.","Curl de bíceps con mancuernas":"De pie con una mancuerna en cada mano, flexiona los codos girando las palmas hacia arriba y baja lento. Sin balancear el torso.","Curl alterno con mancuernas":"De pie, sube una mancuerna a la vez girando la palma hacia arriba y baja lento. Codos pegados y torso quieto.","Curl martillo con mancuernas":"Con las palmas mirándose, flexiona los codos subiendo las mancuernas y baja lento. Codos pegados al cuerpo. Trabaja bíceps y antebrazo.","Curl martillo alterno":"Con palmas mirándose, sube una mancuerna a la vez y baja lento. Codos pegados y sin impulso.","Curl martillo cruzado":"Sube la mancuerna cruzando hacia el hombro contrario con palmas mirándose. Baja lento. Codo pegado al cuerpo.","Curl inclinado con mancuernas":"Sentado en banco inclinado con los brazos colgando, flexiona los codos subiendo las mancuernas. Baja hasta estirar sin impulso. Gran estiramiento del bíceps.","Curl concentrado":"Sentado con el codo apoyado en la cara interna del muslo, flexiona subiendo la mancuerna y baja lento. Sin balancearte.","Curl predicador (Scott) con barra":"Con los brazos apoyados en el banco Scott, baja la barra hasta casi estirar y sube sin despegar los brazos. No dejes caer el peso.","Curl predicador a una mano con mancuerna":"Con el brazo apoyado en el banco predicador, sube la mancuerna y baja lento hasta casi estirar. Cambia de lado.","Curl predicador en máquina":"Sentado con los brazos apoyados en la almohadilla, flexiona los codos y baja lento sin soltar el peso.","Curl de bíceps en máquina":"Sentado con los brazos apoyados, flexiona los codos y baja lento. Hombros relajados y sin impulso.","Curl de bíceps en polea baja":"De pie frente a la polea baja, flexiona los codos subiendo la barra y baja lento. Codos pegados al cuerpo. Tensión constante.","Curl martillo en polea con cuerda":"De pie frente a la polea baja con cuerda, sube con las palmas mirándose y baja lento. Codos pegados y sin impulso.","Curl en polea alta (doble bíceps)":"Con las poleas altas a los lados, flexiona los codos llevando las manos hacia la cabeza como pose de bíceps. Baja lento.","Curl en polea sobre la cabeza":"Con la polea alta o baja detrás, flexiona los codos con los brazos elevados sobre la cabeza y baja lento. Codos fijos.","Curl araña":"Boca abajo en banco inclinado con los brazos colgando, flexiona los codos subiendo la barra. Baja lento. Pecho apoyado.","Curl Zottman":"Sube la mancuerna con las palmas hacia arriba; en la cima gira las palmas hacia abajo y baja lento con ese agarre. Alterna.","Curl inverso con barra":"Con las palmas hacia abajo, flexiona los codos subiendo la barra y baja lento. Trabaja antebrazos y la parte exterior del brazo.","Curl drag con barra":"Con la barra pegada al cuerpo, sube los codos hacia atrás mientras la barra sube pegada al torso. Baja lento. Poco peso.","Curl en polea a un brazo":"De pie junto a la polea, flexiona un codo subiendo la manija y baja lento. Codo pegado al cuerpo y sin impulso.","Extensión de tríceps en polea con barra":"De pie frente a la polea alta con codos pegados, estira los brazos hacia abajo y regresa lento. Sin mover los codos ni los hombros.","Extensión de tríceps en polea con cuerda":"De pie frente a la polea alta con cuerda, estira los brazos hacia abajo separando la cuerda al final. Codos pegados y regresa lento.","Extensión de tríceps en polea con barra V":"De pie frente a la polea alta con barra V, estira los brazos hacia abajo con codos pegados y regresa lento.","Extensión de tríceps en polea agarre supino":"Con las palmas hacia arriba en la barra, estira los brazos hacia abajo con codos pegados y regresa lento.","Extensión de tríceps sobre la cabeza con cuerda":"De espaldas a la polea alta con cuerda sobre la cabeza, estira los brazos hacia adelante y regresa lento. Codos fijos junto a la cabeza.","Press francés de pie con barra":"De pie con la barra sobre la cabeza, baja detrás de la cabeza doblando los codos sin abrirlos y sube. Poco peso y abdomen firme.","Press francés acostado con barra Z":"Acostado con barra Z sobre el pecho, baja doblando los codos hacia la frente y estira. Codos apuntando al techo y quietos.","Press francés declinado con barra Z":"En banco declinado con barra Z, baja doblando los codos hacia la frente y estira. Codos fijos y movimiento controlado.","Press francés con mancuernas":"Acostado con mancuernas, baja doblando los codos hacia los lados de la cabeza y estira. Codos quietos y apuntando al techo.","Extensión de tríceps sobre la cabeza con mancuerna":"Con una mancuerna a dos manos sobre la cabeza, baja detrás doblando los codos y estira. Codos cerca de la cabeza y abdomen firme.","Extensión de tríceps sentado con mancuerna":"Sentado, con una mancuerna sobre la cabeza, baja detrás doblando los codos y estira. Espalda recta y codos cerca de la cabeza.","Extensión de tríceps a una mano con mancuerna":"Con una mancuerna sobre la cabeza, baja detrás doblando el codo y estira. Codo apuntando al techo. Cambia de lado.","Patada de tríceps con mancuerna":"Inclinado con el codo pegado al torso, estira el brazo hacia atrás hasta que quede recto y regresa lento. Hombro quieto.","Extensión de tríceps a un brazo en polea":"Frente a la polea alta, estira un brazo hacia abajo con el codo pegado y regresa lento. Sin mover el hombro.","Extensión de tríceps en máquina":"Sentado con la espalda apoyada, empuja las manijas hacia abajo o al frente hasta estirar los brazos y regresa lento. Codos cerca del cuerpo.","Fondos de tríceps en máquina":"Sentado, empuja las manijas hacia abajo estirando los codos y regresa lento. Hombros abajo y sin impulso.","Press de banca agarre cerrado":"Con las manos al ancho de los hombros, baja la barra al pecho con codos pegados y empuja. Muñecas rectas. Trabaja tríceps y pecho.","Press cerrado con mancuernas":"Acostado con las mancuernas juntas sobre el pecho, baja con codos pegados y empuja. Muñecas rectas.","Press agarre cerrado en Smith":"Bajo la barra guiada con agarre cerrado, baja al pecho con codos pegados y empuja. Muñecas rectas.","Fondos en banco (silla)":"Con las manos en el borde de un banco o silla firme, baja doblando los codos hacia atrás y sube. Espalda pegada al banco. No bajes demasiado si molesta el hombro.","Fondos en paralelas (énfasis tríceps)":"En paralelas con el torso recto, baja doblando los codos hacia atrás y empuja para subir. Codos pegados al cuerpo. No bajes de más si molesta el hombro.","Flexiones cerradas (tríceps)":"Flexión con las manos juntas y codos pegados al cuerpo; baja el pecho y empuja. Cuerpo recto. Trabaja más los tríceps.","Press francés con banda":"Con banda sobre la cabeza, baja detrás doblando los codos y estira. Codos cerca de la cabeza y abdomen firme.","Extensión de tríceps con banda sobre la cabeza":"Pisa la banda y sube las manos sobre la cabeza; estira los codos hacia arriba y regresa lento. Codos cerca de la cabeza.","JM press con barra":"Acostado con la barra sobre el pecho, baja la barra hacia el cuello doblando los codos y estira. Ejercicio avanzado, con poco peso.","Flexiones cerradas inclinadas":"Con las manos juntas sobre un banco, baja el pecho con codos pegados y empuja. Cuerpo recto. Versión más fácil de la flexión cerrada.","Curl de muñeca con barra (palmas arriba)":"Sentado con los antebrazos sobre los muslos y las palmas hacia arriba, baja la barra con las muñecas y sube. Movimiento lento.","Curl de muñeca inverso con barra (palmas abajo)":"Sentado con los antebrazos apoyados y las palmas hacia abajo, baja la barra con las muñecas y sube. Poco peso y movimiento lento.","Curl de muñeca con mancuerna sentado":"Sentado con el antebrazo sobre el muslo, baja la mancuerna con la muñeca y sube. Movimiento lento. Cambia de lado.","Curl de muñeca inverso con mancuerna sentado":"Sentado con el antebrazo apoyado y la palma hacia abajo, baja la mancuerna y sube extendiendo la muñeca. Poco peso.","Rodillo de muñeca (wrist roller)":"De pie con los brazos al frente, enrolla la cuerda con las muñecas subiendo la pesa y desenróllala lento. Poco peso.","Paseo del granjero":"Camina con una mancuerna o pesa pesada en cada mano, con el torso erguido y pasos cortos. Hombros atrás y abdomen firme.","Crunch en polea de rodillas":"De rodillas frente a la polea alta con la cuerda en la nuca, baja el torso redondeando la espalda y sube. Cadera quieta. Siente el abdomen.","Crunch en polea con cuerda":"De rodillas con la cuerda a los lados de la cabeza, baja los codos hacia los muslos contrayendo el abdomen y sube. Cadera quieta.","Crunch en máquina":"Sentado con las manijas a la altura de los hombros, baja el torso contrayendo el abdomen y regresa lento. Sin impulso.","Elevación de piernas colgado":"Colgado de una barra, sube las piernas flexionando la cadera sin balancearte y baja lento. Abdomen apretado.","Pike colgado":"Colgado de una barra, sube las piernas rectas hasta tocar la barra con los pies y baja lento. Ejercicio avanzado.","Elevación de piernas en banco plano":"Acostado en un banco con las manos agarradas, sube las piernas hasta la cadera y baja lento sin tocar el banco. Zona lumbar pegada.","Rodillas al pecho tumbado":"Acostado, lleva las rodillas al pecho apretando el abdomen y baja lento. Zona lumbar pegada al suelo.","Crunch abdominal":"Acostado con las rodillas dobladas, sube los hombros del suelo contrayendo el abdomen y baja lento. Sin jalar del cuello.","Crunch inverso":"Acostado, lleva las rodillas hacia el pecho elevando la cadera y baja lento. Sin impulso. Abdomen apretado.","Crunch declinado":"En banco declinado con las rodillas dobladas, sube el torso contrayendo el abdomen y baja lento. Sin jalar del cuello.","Crunch cruzado":"Acostado, sube un hombro hacia la rodilla contraria y alterna. Abdomen apretado y sin jalar del cuello.","Crunch oblicuo":"Acostado de lado o con rodillas dobladas, sube el torso girando hacia un lado y regresa. Abdomen apretado. Sin jalar del cuello.","Bicicleta abdominal":"Acostado, lleva un codo hacia la rodilla contraria mientras extiendes la otra pierna y alterna. Movimiento lento y controlado.","Abdominal sit-up":"Acostado con las rodillas dobladas, sube hasta sentarte contrayendo el abdomen y baja lento. Evita jalar del cuello.","Abdominal navaja (jackknife)":"Acostado con brazos y piernas extendidos, sube torso y piernas a la vez tocando los pies con las manos y baja lento. Avanzado.","Plancha":"Apoyado sobre los antebrazos y las puntas, mantén el cuerpo recto de cabeza a talones. Abdomen y glúteos apretados. No hundas la cadera.","Plancha lateral":"De lado apoyado en un antebrazo, levanta la cadera y mantén el cuerpo recto. Respira normal. Cambia de lado.","Dead bug":"Acostado con brazos y piernas al techo, baja brazo y pierna contrarios sin despegar la espalda baja del suelo y alterna. Movimiento lento.","Giros rusos (Russian twist)":"Sentado con el torso inclinado atrás y pies elevados o apoyados, gira el torso llevando las manos de lado a lado. Abdomen apretado.","Giros rusos en polea":"Sentado o de pie junto a la polea, gira el torso llevando la manija de un lado al otro con los brazos extendidos. Abdomen firme.","Leñador en polea (wood chop)":"De pie junto a la polea alta, jala la manija en diagonal hacia abajo girando el torso y regresa lento. Abdomen firme.","Press Pallof en polea":"De pie de lado a la polea, sostén la manija al pecho y empuja al frente sin dejar que te gire. Abdomen y glúteos firmes.","Press Pallof con rotación":"De pie de lado a la polea, empuja la manija al frente y haz un giro controlado antes de regresar. Abdomen firme.","Rueda abdominal con barra":"Arrodillado, rueda la barra al frente estirando el cuerpo y regresa contrayendo el abdomen. Espalda neutra. Avanzado.","Rueda abdominal con barra de rodillas":"De rodillas, rueda la rueda al frente estirando el cuerpo y regresa contrayendo el abdomen. No arquees la espalda.","Crunch en pelota de ejercicio":"Acostado con la espalda sobre la pelota, sube el torso contrayendo el abdomen y baja lento. Pies firmes y sin jalar del cuello.","Flexión lateral con mancuerna":"De pie con una mancuerna en una mano, inclina el torso hacia ese lado y regresa. Movimiento lento y sin rotar.","Rotaciones landmine 180°":"Con la barra anclada en una esquina, gira la barra de un lado a otro con los brazos extendidos y torso firme. Movimiento controlado.","Spider crawl (gateo de araña)":"En posición de plancha, lleva una rodilla hacia el codo del mismo lado y alterna caminando. Cadera baja y abdomen firme.","Codo a rodilla":"Acostado, lleva un codo hacia la rodilla contraria elevándola y alterna. Abdomen apretado y sin jalar del cuello.","Elevación de cadera con rodillas flexionadas":"Acostado con las piernas dobladas a 90°, sube la cadera del suelo contrayendo el abdomen y baja lento. Sin impulso.","Toques de talón alternos":"Acostado con las rodillas dobladas, alcanza el talón con la mano de cada lado alternando. Abdomen apretado.","Crunch con rodillas recogidas":"Acostado, lleva las rodillas al pecho mientras subes el torso y regresa lento. Abdomen apretado.","Molino con kettlebell (windmill)":"De pie con un kettlebell arriba, inclina el torso bajando la mano libre hacia el pie sin perder de vista el kettlebell y sube. Avanzado; empieza con poco peso.","Saltar la cuerda":"Salta con la cuerda con saltos pequeños, codos pegados y muñecas haciendo el giro. Aterriza suave sobre las puntas.","Mountain climbers (escaladores)":"En posición de plancha, lleva las rodillas hacia el pecho alternando rápido. Cadera baja y abdomen firme.","Salto estrella":"De pie, salta abriendo piernas y brazos hacia los lados y regresa. Aterriza suave y mantén el abdomen firme.","Skipping rápido (rodillas altas)":"Corre en el lugar subiendo las rodillas altas lo más rápido que puedas. Torso erguido y brazos activos.","Talones al glúteo saltando":"Corre en el lugar llevando los talones hacia los glúteos. Torso erguido y aterriza suave.","Salto en tijera (zancada con salto)":"Desde zancada, salta cambiando de pierna en el aire y aterriza suave. Ejercicio avanzado y de impacto; cuida las rodillas.","Salto con rodillas al pecho":"Salta llevando las rodillas al pecho y aterriza suave. Ejercicio de impacto; evita si tienes dolor en rodillas o espalda.","Salto lateral (bound)":"Salta lateralmente de una pierna a la otra aterrizando suave y estable. Rodilla alineada con el pie.","Bicicleta al aire libre":"Pedalea a ritmo constante al aire libre. Ajusta la altura del asiento para que la rodilla quede casi extendida abajo. Usa casco.","Sprint empujando trineo":"Empuja el trineo con el torso inclinado y brazos extendidos, dando pasos fuertes. Espalda recta y abdomen firme.","Cinta: caminata inclinada":"Camina en la cinta con inclinación sin sujetarte de los barandales. Postura erguida y paso natural.","Cinta: trote suave":"Trota a un ritmo en que puedas hablar. Postura erguida, pasos suaves y brazos relajados.","Cinta: intervalos (HIIT)":"Alterna periodos de esfuerzo fuerte con periodos de descanso en la cinta. Calienta antes y no te sujetes de los barandales.","Bicicleta estática":"Pedalea con el asiento a la altura de la cadera y la espalda recta. Mantén un ritmo constante o por intervalos.","Elíptica":"Mantén una postura erguida y movimiento fluido, empujando con las piernas. Ajusta la resistencia a tu nivel.","Remo en ergómetro":"Empuja con las piernas primero, luego inclina el torso y jala con los brazos; regresa en orden inverso. Espalda recta.","Escaladora (stairmaster)":"Sube los escalones con postura erguida sin apoyarte en las barandas. Ajusta la velocidad a tu nivel.","Assault bike (intervalos)":"Pedalea y empuja con los brazos en intervalos fuertes y descansos. Calienta antes y mantén el torso firme.","Caminata rápida":"Camina a paso rápido con brazos activos y postura erguida. Respiración controlada.","Burpees":"Desde de pie baja las manos al suelo, lanza los pies atrás a plancha, regresa y salta con brazos arriba. Abdomen firme. Avanzado y de impacto.","Jumping jacks":"De pie, salta abriendo piernas y juntando las manos arriba y regresa. Aterriza suave.","Skaters (saltos laterales)":"Salta lateralmente de una pierna a la otra como patinador con el torso inclinado. Aterriza suave y estable.","Boxeo de sombra":"Con la guardia arriba, lanza golpes al aire alternando brazos y moviendo los pies. Gira con la cadera y mantén el abdomen firme.","Elevación de talones en un escalón":"De pie en el borde de un escalón, sube de puntas y baja el talón por debajo del escalón. Pausa arriba y baja lento.","Elevación de talones a una pierna":"De pie sobre una pierna, sube de puntas y baja lento. Apóyate de una pared para el equilibrio. Cambia de lado.","Elevación de talones con mochila cargada":"Con una mochila con peso, sube de puntas y baja lento estirando bien. Mantén el equilibrio y no rebotes.","Sentadilla isométrica en pared":"Apoya la espalda en la pared con las rodillas a 90° y mantén la posición el tiempo indicado. Pies al frente y rodillas sobre los tobillos.","Hip thrust en banco o sofá (peso corporal)":"Con la espalda alta apoyada en un banco o sofá, sube la cadera apretando glúteos hasta alinear el torso y baja. Barbilla pegada.","Almeja con banda (clamshell)":"Acostado de lado con las rodillas dobladas y la banda sobre ellas, abre la rodilla de arriba sin mover la cadera y regresa lento. Cambia de lado.","Caminata lateral con banda":"Con la banda sobre las rodillas, camina de lado con pasos pequeños y controlados. Rodillas ligeramente flexionadas.","Remo con mochila cargada inclinado":"Inclinado con la espalda recta y una mochila con peso en las manos, jala hacia las costillas juntando los omóplatos y baja lento.","Remo con banda":"Con la banda anclada al frente, jala hacia el abdomen juntando los omóplatos y regresa lento. Espalda recta.","Jalón con banda anclada":"Con la banda anclada arriba, jala hacia el pecho llevando los codos abajo y regresa lento. Hombros abajo.","Curl de bíceps con banda":"Pisa la banda y flexiona los codos subiendo las manos hacia los hombros y baja lento. Codos pegados al cuerpo.","Curl de bíceps con mochila":"De pie con una mochila con peso, flexiona los codos y súbela hacia los hombros y baja lento. Codos pegados al cuerpo.","Flexiones pike (hombro)":"En posición de V invertida con la cadera alta, baja la cabeza hacia el suelo doblando los codos y empuja. Trabaja los hombros. Espalda recta.","Elevaciones laterales con botellas":"De pie, sube las botellas hacia los lados hasta la altura de los hombros con codos suaves y baja lento. Sin impulso.","Face pull con banda":"Con la banda anclada a la altura de la cara, jala hacia la cara abriendo los codos y regresa lento. Hombros abajo.","Sentadilla sumo con peso corporal":"Con los pies muy abiertos y puntas hacia afuera, baja con la espalda recta y sube apretando glúteos. Rodillas siguen la dirección de los pies.","Sentadilla búlgara (pie trasero en una silla)":"Con un pie trasero apoyado en una silla, baja doblando la pierna delantera con el torso recto y sube. Rodilla alineada con el pie. Cambia de lado.","Sentadilla con pausa de 3 segundos":"Baja en sentadilla, pausa 3 segundos abajo con control y sube. Espalda recta. Rodillas siguen la dirección de los pies.","Zancada lateral sin peso":"Da un paso grande hacia un lado, flexiona esa rodilla llevando la cadera atrás con la otra pierna recta y regresa. Torso recto.","Zancada inversa sin peso":"Da un paso atrás, baja la rodilla trasera hacia el suelo y regresa. Torso recto y abdomen firme. Alterna piernas.","Peso muerto a una pierna sin peso":"De pie sobre una pierna, inclina el torso llevando la otra pierna atrás y sube. Espalda recta. Cambia de lado.","Buenos días sin peso":"De pie con las manos en la nuca o pecho, inclina el torso con espalda recta llevando la cadera atrás y sube. Rodillas ligeramente flexionadas.","Puente de glúteo con talones elevados en silla":"Acostado con los talones sobre una silla, sube la cadera apretando glúteos y baja lento. Hombros apoyados.","Hip thrust a una pierna en banco o sofá":"Con la espalda alta apoyada y una pierna extendida, sube la cadera con la otra apretando glúteos y baja. Cadera nivelada.","Patada de glúteo con pierna flexionada (donkey kick)":"En cuadrupedia con la rodilla flexionada a 90°, empuja el talón hacia el techo apretando el glúteo y baja. Espalda neutra.","Flexiones con pausa abajo":"En posición de flexión, baja el pecho hasta casi tocar el suelo, pausa un segundo y empuja. Cuerpo recto.","Flexiones con manos en pared":"De pie frente a una pared, apoya las manos y baja el pecho hacia ella doblando los codos y empuja. Cuerpo recto. Versión más fácil.","Superman con brazos en Y":"Boca abajo, sube los brazos formando una Y y levanta pecho y brazos apretando la espalda alta. Mira al suelo y baja lento.","Remo con toalla anclada a una puerta":"Con una toalla anclada en una puerta cerrada, inclínate hacia atrás y jala el cuerpo hacia la puerta juntando los omóplatos. Asegura bien el anclaje.","Extensión de tríceps con mochila sobre la cabeza":"De pie con una mochila con peso sostenida sobre la cabeza, baja detrás doblando los codos y estira. Codos cerca de la cabeza y abdomen firme.","Fondos entre dos sillas":"Con las manos apoyadas en dos sillas firmes, baja el cuerpo entre ellas doblando los codos y sube. Asegura que las sillas no se muevan.","Plancha con toque de hombro":"En posición de plancha alta, toca un hombro con la mano contraria sin girar la cadera y alterna. Abdomen firme.","Abdominal en V (V-ups)":"Acostado con brazos y piernas extendidos, sube torso y piernas a la vez formando una V y baja lento. Avanzado.","Elevación de piernas tumbado con pausa":"Acostado, sube las piernas rectas y pausa arriba un momento; baja lento sin tocar el suelo. Zona lumbar pegada al suelo."};

<details style="margin-top:8px"><summary class="mut">Cómo decide el generador</summary><div class="mut" style="margin-top:6px">• Volumen semanal por músculo según el nivel (principiante 8-10 series para los grandes, intermedio 12-14, avanzado 16-18) y repartido entre los días en que se entrena.<br>• Repeticiones y descansos según objetivo: fuerza 3-5 reps y 2-3 min en los básicos; hipertrofia 6-12 en básicos y 10-15 en aislamiento; pérdida de grasa 10-20 reps con descansos cortos y cardio al final; salud y tono 10-15 reps.<br>• Primero ejercicios compuestos y después aislamiento. Si un músculo se entrena dos veces por semana, un día es más pesado y el otro más ligero.<br>• Mujeres: más volumen de glúteo, cuádriceps y femoral. Hombres: más pecho, espalda y hombro. Otro: reparto equilibrado.<br>• Lesiones activas y equipo que no tiene el cliente: se excluyen los ejercicios que no le convienen (reglas generales; revísalas siempre).<br>• Las notas del plan explican las 4 semanas en lenguaje sencillo.<br>• Los ejercicios se eligen al azar solo entre opciones equivalentes y no se repiten dentro de la rutina.</div></details></div>`+(R?`<div class="box row"><input id="rn" value="${esc(rname)}" placeholder="Nombre, ej. Fuerza semanas 1-4"><button class="pri" data-a="save">${rid?'Guardar cambios':T?'Guardar en el perfil del cliente':'Guardar plantilla'}</button>${T&&cur?'<button data-a="adapt">Adaptar a este cliente</button>':''}</div><div id="ed">${editor()}</div>`:'')}
