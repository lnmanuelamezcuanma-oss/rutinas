body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}

 const cardio=(di,kind)=>{const a=CAT.filter(e=>e.g=='Ca'&&e.t<=tier&&okE(e)&&LWT[lv][LI[e.lv]]>0&&e.f.includes(kind)).map(e=>{let w=LWT[lv][LI[e.lv]]*ew(e);if(ctx.used.has(e.es))w*=.1;if(avoid.has(e.es))w*=.4;return{e,w:w*w}});

function planNote(split,g,lv,nd,cardio){
 const s3=['2','2','1 o 2'][lv],L=[];
 L.push(`Plan de 4 semanas · ${split} · ${nd} días por semana.`);
 L.push(`Cómo leer tu rutina: "3 × 8-10" significa 3 series de 8 a 10 repeticiones. Entre series descansa el tiempo que indica cada ejercicio.`);
 L.push(`Cómo elegir el peso: escoge un peso con el que termines todas las repeticiones con buena técnica y todavía te sobren algunas (abajo se indica cuántas en cada semana). Si te sobran muchas, el peso es muy ligero. Si apenas terminas o pierdes la técnica, es muy pesado.`);
 L.push(`Semana 1 · Adaptación: usa un peso cómodo, de modo que te sobren 3 repeticiones al terminar cada serie. Aprende la técnica de cada ejercicio y anota el peso que usas.`);
 L.push(`Semana 2 · Sube un poco: con el mismo peso intenta hacer más repeticiones en cada serie, hasta llegar al número más alto del rango. Cuando lo logres en todas las series de un ejercicio, sube el peso lo mínimo posible (la siguiente pesa más pequeña que tengas).`);
 L.push(`Semana 3 · Más exigente: termina cada serie sintiendo que solo te sobran ${s3} repeticiones. Sigue subiendo el peso cuando completes todas las repeticiones del rango.`);
 L.push(`Semana 4 · Tu mejor semana: mantén el mismo esfuerzo e intenta superar los pesos y repeticiones que anotaste. Si estás muy cansado o con molestias, haz una serie menos en cada ejercicio esa semana.`);
 if(g=='fuerza')L.push(`Ejercicios principales: los primeros de cada día se repiten las 4 semanas para que puedas subir el peso con orden. En esos descansa todo el tiempo indicado.`);
 if(cardio)L.push(`Cardio: se hace al final del día, después de las pesas. "Ritmo constante" es un esfuerzo con el que podrías hablar con frases cortas. En los intervalos alterna esfuerzo fuerte y suave como se indica.`);
 L.push(`Importante: el cansancio y el ardor en el músculo son normales; el dolor en una articulación no. Si algo te duele, detén ese ejercicio y avísame.`);
 return L.join('\n')}
/* Adapta una rutina o plantilla existente a un cliente: lugar, equipo que no tiene y lesiones activas */
function adapt(R0,o){
 o=o||{};const R=JSON.parse(JSON.stringify(R0)),tier=tierOf(o.place),inj=new Set((o.injuries||[]).filter(k=>INJR[k])),ne=new Set(o.noEquip||[]),log=[],rnd=Math.random;
 const why=e=>e.t>tier?'no cabe en su lugar de entrenamiento':ne.has(e.eq)?'no tiene '+(EQN[e.eq]||'ese equipo').toLowerCase():(k=>k?'carga '+INJN[k].toLowerCase()+' (lesión)':'')(injBad(e,inj));
 const ok=e=>e.t<=tier&&!ne.has(e.eq)&&!injBad(e,inj);
 const used=new Set();R.days.forEach(d=>d.ex.forEach(x=>used.add(x.n)));
 let changed=0;
 R.days.forEach(d=>{const out=[];
  d.ex.forEach(x=>{const e=findEx(x.n);
   if(!e){if(x.n)log.push(`"${x.n}" no está en la biblioteca: no pude revisarlo.`);out.push(x);return}
   const w=why(e);if(!w){out.push(x);return}
   const st=/s/.test(e.f),kind=e.g=='Ca'?(/h/.test(e.f)?'h':'l'):null,rank=c=>(c.c==e.c?3:0)+(bt(c)==bt(e)?1:0)+(LI[c.lv]<=LI[e.lv]?1:0)+(c.q==e.q?.5:0)+rnd();
   const cands=CAT.filter(c=>c.g==e.g&&c.es!=e.es&&!used.has(c.es)&&ok(c)&&/s/.test(c.f)==st&&(kind?(kind=='h'?/h/.test(c.f):/l/.test(c.f)):true)).map(c=>[rank(c),c]).sort((a,b)=>b[0]-a[0]).map(z=>z[1]);
   changed++;
   if(!cands.length){log.push(`Quité "${x.n}" (${w}) y no encontré reemplazo.`);return}
   const c=cands[0];used.add(c.es);log.push(`"${x.n}" → "${c.es}" (${w}).`);out.push({...x,m:GN[c.g],n:c.es})});
  d.ex=out});
 return{r:R,log,changed}}

 if(!none&&!inj.length)return err('Marca tus lesiones, o marca "No tengo lesiones ni molestias"'),null;

 if(!$('#med').value)return err('Responde si algún médico te ha dicho que no debes hacer ejercicio'),null;

   :`<p style="margin:10px 0 4px"><b>Plan actual: semana ${wk} de 4</b> <span class="mut">· te quedan ${28-ds} días</span></p><div class="bar"><i style="width:${Math.round(ds/28*100)}%"></i></div>`}
 const nx=BD.find(b=>d<b[0]),b1=BD.map(([t,nm,em])=>({nm,em,on:d>=t,txt:d>=t?'Lograda':'Faltan '+(t-d)+' días'})),b2=BP.map(([t,nm,em])=>({nm,em,on:n>=t,txt:n>=t?'Lograda':'Faltan '+(t-n)+(t-n==1?' plan':' planes')}));

<details style="margin-top:8px"><summary class="mut">Cómo decide el generador</summary><div class="mut" style="margin-top:6px">• Volumen semanal por músculo según el nivel (principiante 8-10 series para los grandes, intermedio 12-14, avanzado 16-18) y repartido entre los días en que se entrena.<br>• Repeticiones y descansos según objetivo: fuerza 3-5 reps y 2-3 min en los básicos; hipertrofia 6-12 en básicos y 10-15 en aislamiento; pérdida de grasa 10-20 reps con descansos cortos y cardio al final; salud y tono 10-15 reps.<br>• Primero ejercicios compuestos y después aislamiento. Si un músculo se entrena dos veces por semana, un día es más pesado y el otro más ligero.<br>• Mujeres: más volumen de glúteo, cuádriceps y femoral. Hombres: más pecho, espalda y hombro. Otro: reparto equilibrado.<br>• Lesiones activas y equipo que no tiene el cliente: se excluyen los ejercicios que no le convienen (reglas generales; revísalas siempre).<br>• Las notas del plan explican las 4 semanas en lenguaje sencillo.<br>• Los ejercicios se eligen al azar solo entre opciones equivalentes y no se repiten dentro de la rutina.</div></details></div>`+(R?`<div class="box row"><input id="rn" value="${esc(rname)}" placeholder="Nombre, ej. Fuerza semanas 1-4"><button class="pri" data-a="save">${rid?'Guardar cambios':T?'Guardar en el perfil del cliente':'Guardar plantilla'}</button>${T&&cur?'<button data-a="adapt">Adaptar a este cliente</button>':''}</div><div id="ed">${editor()}</div>`:'')}

const editor=()=>(arr(R.adj).length?`<div class="alert"><b>Ajustes automáticos</b> <span class="mut">(solo los ves tú)</span><br>${R.adj.map(esc).join('<br>')}</div>`:'')+`<div class="box"><label class="mut">Notas generales de la rutina (las ve el cliente)</label><textarea data-f="note" rows="12">${esc(R.note||'')}</textarea><div class="row"><div><label class="mut">Descanso general (opcional)</label><input data-f="rest" value="${esc(R.rest||'')}"></div></div>${R.split?`<p class="mut" style="margin:8px 0 0">División usada: ${esc(R.split)}</p>`:''}</div>`+R.days.map((d,i)=>`<div class="day"><div class="dh"><input data-d="${i}" data-f="name" value="${esc(d.name)}"><button data-a="delD" data-d="${i}">Quitar día</button></div><div style="padding:6px 10px 0"><input data-d="${i}" data-f="note" value="${esc(d.note||'')}" placeholder="Nota del día (calentamiento, indicaciones)"></div>${d.ex.map((e,k)=>rowH(e,i,k)).join('')}<div style="padding:6px 10px"><button data-a="addE" data-d="${i}">+ Ejercicio</button></div></div>`).join('')+`<button data-a="addD" style="margin-bottom:12px">+ Día</button>`;
const redraw=()=>{$('#ed').innerHTML=editor()};
const libView=()=>`<div class="box"><b>Biblioteca de ejercicios</b> <span class="mut" id="lcount"></span><p class="mut" style="margin:6px 0 0">Toca un ejercicio para ver las fotos de inicio y fin y su nombre en inglés. Imágenes de la base abierta free-exercise-db (dominio público).</p><div class="row"><input id="lq" placeholder="Buscar por nombre en español o inglés" value="${esc(libQ)}"><select id="lg"><option value="">Todos los músculos</option>${Object.keys(GN).map(k=>`<option value="${k}"${k==libG?' selected':''}>${GN[k]}</option>`).join('')}</select><select id="lt">${optS([['','Todos los lugares'],['0','Casa, sin equipo'],['1','Casa con mancuernas o bandas'],['2','Gimnasio (todo)']],libT)}</select></div></div><div class="lgrid" id="lgrid"></div>`;
function fillLib(){const g=$('#lgrid');if(!g)return;const q=libQ.trim().toLowerCase();
 const L=CAT.filter(e=>(!libG||e.g==libG)&&(libT===''||e.t<=+libT)&&(!q||e.es.toLowerCase().includes(q)||e.en.toLowerCase().includes(q)));
 g.innerHTML=L.slice(0,libN).map(e=>`<button class="lc" data-a="ex" data-n="${esc(e.es)}">${thumb(e.es)}<span><b>${esc(e.es)}</b><small>${GN[e.g]} · ${LVN[e.lv]}</small><small>${esc(e.en||'Sin foto')}</small></span></button>`).join('')+(L.length>libN?`<button data-a="more">Mostrar más (${L.length-libN})</button>`:'');
 if(!L.length)g.innerHTML='<p class="mut">No hay ejercicios con ese filtro.</p>';
 const c=$('#lcount');if(c)c.textContent='· '+L.length+' ejercicios'}
function render(){const base=location.origin+location.pathname,C=tab=='c';
 const nav=[['c','Clientes'],['t','Plantillas'],['e','Ejercicios']].map(([k,l])=>`<button class="${tab==k?'on':''}" data-a="tab" data-t="${k}">${l}</button>`).join('');
 app.innerHTML=`<div class="top"><h1>Panel de administrador</h1>${nav}<button onclick="out()">Salir</button></div><main>${tab=='e'?libView():`<div class="adm"><div>${C?clientsCol(base):tplCol()}</div><div>${C?(cur?clientPanel():'<div class="box mut">Elige un cliente de la lista para ver sus datos de salud y rutinas, y crearle una nueva.</div>'):work()}</div></div>`}</main><datalist id="dl">${CAT.map(e=>`<option value="${esc(e.es)}"${e.en?` label="${esc(e.en)}"`:''}>`).join('')}</datalist>`;
 if(tab=='e')fillLib()}
async function adminView(){await load();render()}
const keepY=f=>{const y=scrollY;f();scrollTo(0,y)};
document.addEventListener('input',e=>{const t=e.target,{d,x,f}=t.dataset;
 if(t.id=='u'){const v=uname(t.value);if(v!==t.value)t.value=v;schedUser();return}
 if(t.id=='cq'){cq=t.value;const l=$('#clist');if(l)l.innerHTML=clientList();return}
 if(t.id=='rn'){rname=t.value;return}
 if(t.id=='lq'){libQ=t.value;libN=60;fillLib();return}
 if(!R||!f)return;if(x!=null)R.days[d].ex[x][f]=t.value;else if(d!=null)R.days[d][f]=t.value;else R[f]=t.value});
document.addEventListener('change',async e=>{const t=e.target,g=t.dataset.g;
 if(g){G0[g]=t.value;return}
 if(t.id=='noinj'||t.id=='nocond'){if(t.checked)document.querySelectorAll(`[data-ck="${t.id=='noinj'?'inj':'cond'}"]`).forEach(x=>x.checked=false);return}
 if(t.dataset.ck=='inj'||t.dataset.ck=='cond'){if(t.checked){const n=$(t.dataset.ck=='inj'?'#noinj':'#nocond');if(n)n.checked=false}return}
 if(t.dataset.c&&cur){const k=t.dataset.c;let v=t.value;if(k=='days')v=+v;if(k=='plan_start'&&!v)v=null;
  const r=await sb.from('profiles').update({[k]:v}).eq('id',cur.id);if(r.error)return toast('No se pudo guardar: '+r.error.message);
  cur[k]=v;if(G0[k]!==undefined&&k!='plan_start')G0[k]=v;keepY(render);toast('Guardado');return}
 if(t.dataset.cc&&cur){const k=t.dataset.cc,v=[...document.querySelectorAll(`[data-cc="${k}"]:checked`)].map(x=>x.value);
  const r=await sb.from('profiles').update({[k]:v}).eq('id',cur.id);if(r.error)return toast('No se pudo guardar: '+r.error.message);cur[k]=v;toast('Guardado');return}
 if(t.id=='lg'){libG=t.value;libN=60;fillLib();return}
 if(t.id=='lt'){libT=t.value;libN=60;fillLib();return}
 if(R&&t.dataset.f=='n'){const{d,x}=t.dataset,ex=R.days[d].ex[x];let v=t.value.trim();const c=findEx(v);if(c&&c.es!=v){v=c.es;t.value=v}ex.n=v;const row=t.closest('.rw');row.querySelector('.tc').innerHTML=thumb(v);
  if(c&&!ex.m){ex.m=GN[c.g];row.querySelector('[data-f="m"]').value=ex.m}}});
const restrOf=()=>tab=='c'&&cur?{injuries:arr(cur.injuries),noEquip:arr(cur.no_equip)}:{injuries:[],noEquip:[]};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const{a,d,x,id}=t.dataset,T=tab=='c';
 const sure=()=>{if(t.dataset.sure)return 0;t.dataset.sure=1;t.textContent='¿Seguro?';return 1};
 switch(a){
 case'toLogin':e.preventDefault();authView('login');break;
 case'toReg':e.preventDefault();authView('reg');break;
 case'showcode':e.preventDefault();RG={...RG,showCode:true,n:$('#n').value,u:$('#u').value,p:$('#p').value,g:$('#g').value,l:$('#l').value,s:$('#s').value,d:+$('#d').value,pl:$('#pl').value};regView();break;
 case'intake':intakeView();break;
 case'back':boot();break;
 case'copy':{const i=$('#lnk');i.select();let ok=false;try{ok=await navigator.clipboard.writeText(i.value).then(()=>true)}catch(_){try{ok=document.execCommand('copy')}catch(_){}}toast(ok?'Link copiado. Pégalo en WhatsApp, redes o tu publicidad.':'Mantén presionado el link y elige Copiar');break}
 case'ex':showEx(t.dataset.n);break;
 case'xm':$('#mdl').style.display='none';break;
 case'more':libN+=60;fillLib();break;
 case'tab':tab=t.dataset.t;R=rid=null;rname='';adminView();break;
 case'pick':cur=clients.find(c=>c.id==id);G0={goal:cur.goal,level:cur.level,sex:cur.sex,days:cur.days,place:cur.place,split:'auto'};R=rid=null;rname='';adminView();break;
 case'new':R=rid=null;rname='';render();break;
 case'gen':{const av=new Set();if(T&&cur)rts.slice(0,2).forEach(r=>((r.data&&r.data.days)||[]).forEach(dd=>dd.ex.forEach(ee=>av.add(ee.n))));
  R=gen({...G0,avoid:av,...restrOf()});rid=null;rname=T?'Rutina '+G0.goal:'Plantilla '+G0.goal+' '+G0.days+' días';render();toast(R.msg||'Rutina generada (división: '+R.split+'). Revísala, edítala y guárdala.');break}
 case'blank':R={rest:'',note:'',days:[{name:'Día 1',note:'',ex:[]}]};rid=null;rname='';render();break;
 case'lt':{const p=tpls.find(z=>z.id==$('#tp').value);if(!p)return toast('Elige una plantilla primero');const a2=adapt(p.routine,{place:G0.place,...restrOf()});R=a2.r;R.adj=a2.log;rid=null;rname=p.name;render();toast(a2.changed?'Plantilla cargada y ajustada: '+a2.changed+' ejercicio(s) cambiados o quitados. Revisa los ajustes y guarda.':'Plantilla cargada: no necesitó cambios. Guárdala para asignarla.');break}
 case'adapt':{const a2=adapt(R,{place:G0.place,...restrOf()});R=a2.r;R.adj=a2.log;render();toast(a2.changed?'Ajustada: '+a2.changed+' ejercicio(s) cambiados o quitados.':'No hizo falta cambiar nada.');break}
 case'openR':{const r=rts.find(z=>z.id==id);R=copy(r.data);rid=r.id;rname=r.name;render();break}
 case'openT':{const p=tpls.find(z=>z.id==id);R=copy(p.routine);rid=p.id;rname=p.name;render();break}
 case'save':{if(busy)return;if(!R)return toast('Primero crea o genera una rutina');const name=($('#rn').value||'').trim()||'Sin nombre';rname=name;busy=1;t.disabled=true;
  const tb=T?'routines':'templates',p=T?{name,data:R}:{name,routine:R};if(T&&!rid)p.client_id=cur.id;
  const q=rid?await sb.from(tb).update(p).eq('id',rid):await sb.from(tb).insert(p).select('id').single();busy=0;
  if(q.error){t.disabled=false;return toast('No se pudo guardar: '+q.error.message)}
  if(!rid)rid=q.data.id;await adminView();toast(T?'Guardada en el perfil de '+cur.full_name:'Plantilla guardada');break}
 case'delR':case'delT':{if(sure())return;await sb.from(a=='delR'?'routines':'templates').delete().eq('id',id);if(rid==id){R=rid=null;rname=''}await adminView();toast('Eliminada');break}
 case'delc':{if(sure())return;const r=await sb.rpc('delete_client',{cid:cur.id});if(r.error)return toast('No se pudo eliminar: '+r.error.message);cur=null;R=rid=null;await adminView();toast('Cliente eliminado. Su usuario ya puede volver a usarse.');break}
 case'addD':R.days.push({name:'Día '+(R.days.length+1),note:'',ex:[]});redraw();break;
 case'delD':R.days.splice(d,1);redraw();break;
 case'addE':R.days[d].ex.push({m:'',n:'',s:'3',r:'10-12',d:'60-90 s',t:''});redraw();break;
 case'delE':R.days[d].ex.splice(x,1);redraw();break;
 }});
init();
</script>
</body>
</html>
